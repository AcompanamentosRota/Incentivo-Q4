   selo (o motor continua devolvendo o motivo, a tela não escreve mais), as legendas e o aviso de SVs fora do
   ranking saem da tela (o aviso continua em Regras > Dados e alertas), os blocos ganham cor (Aperitivo laranja,
   Skyy azul, no padrão do Desafio Q4: título escuro e células em tom bem claro), a Dif. negativa fica vermelha
   e o % de cobertura ganha o quadradinho verde/vermelho — a cor vem de motor.corDoPercentual, nunca daqui.
   Etapa 4F (regras v1.7, seção 7; pedidos da Karen em 09/11/2026, vendo a 4D na tela): só apresentação outra vez
   — o conteúdo de TODAS as tabelas fica centralizado, a coluna Dez do Aperitivo só existe em dezembro, "Soma"
   passa a "% Acum." e o "% Acum." do Skyy a "% Médio", os números do Aperitivo deixam a fonte condensada grande
   e ficam do tamanho dos do bloco Skyy, a coluna do mês vigente do Aperitivo ganha quadradinho (cor de
   motor.corDoPercentualAperitivo, que lê o limite da trava do mês) e o Consultor e o Detalhe do mês recebem as
   mesmas cores e os mesmos quadradinhos das tabelas de ranking. Nenhum número muda.
   Etapa 4G (regras v1.7, seção 7; pedido da Karen em 09/11/2026): navegação por páginas no lugar da rolagem na
   Supervisão (uma paginação por canal), no Consultor — que passa a abrir com TODAS as rotas — e no Detalhe do
   mês, que também passa de 15 linhas. O tamanho da página vem de CONFIG.linhasPorPagina e a fatia de
   adapter.fatiar: a tela não conta páginas. A linha de total fica fora da conta e se repete em toda página. O
   Ranking GC (12 linhas) cabe numa página só, então continua sem botões. Nenhum número muda.
   Etapa 4H (regras v1.8, seções 2, 5 e 7; decisão da Karen de 09/11/2026, noite): o "Bateu!", a coluna Oficial e a
   posição em cinza passam a seguir os DOIS pilares (Skyy e volume de Aperitivo), decididos pelo motor
   (l.gatilhoPilares, l.oficial, l.status). Sem coluna nova (pendência 26); só os textos e as contagens mudam.
   Etapa 4I (decisão da Karen de 09/11/2026, pendência 27): a visão GERÊNCIA do Detalhe do mês deixa de ser
   paginada — todas as linhas e o Total Band numa tela só, sem botões. A visão Supervisão do Detalhe, a Supervisão
   e o Consultor continuam em páginas. A escolha é do adaptador (paginaDoDetalhe, que chama fatiar). Nenhum número
   muda.
   Etapa 4J (regras v1.10, seções 5 e 7; decisão da Karen de 10/11/2026): as duas tabelas de ranking passam a ter
   SÓ a coluna da posição oficial, a que conta — a outra coluna de posição sai da tela, e com ela a regra
   de pintá-la em cinza (o CSS dela e a variável de cor saíram). O motor continua calculando as duas posições, e a
   ORDEM das linhas é a mesma (vem do adaptador, já ordenada pelo % Acum. de Aperitivo): nenhuma célula de dado,
   ordem ou status muda.
   Etapa 4K (regras v1.11, seções 2.2, 3 e 5; decisão da Karen de 10/11/2026): o volume de Aperitivo deixa de ter
   gatilho por média e passa a ter um MÍNIMO — o % do mês vigente em 100% ou mais (motor.minimoVolume) —, e a soma
   dos meses passa a servir só para ordenar o ranking. Na tela: o cabeçalho da coluna da posição oficial vira
   "RANK" (pendência 29 resolvida), o título do bloco Aperitivo perde o texto "GATILHO ≥ …" (pendência 28
   resolvida), o rodapé e a aba Regras passam a falar de mínimo de volume. Layout, colunas, ordem das linhas e
   cores não mudam; quem tem "✓ Bateu!" e quem recebe número em RANK podem mudar, porque a conta do pilar mudou.
   Etapa 4L (regras v1.12; decisão da Karen de 10/11/2026): a lista "Dados e alertas" da aba Regras passa a ter só
   alerta de DADO — as premissas a confirmar saíram dela e ficam no documento de regras (seção 10) e no checklist.
   A lista continua vindo inteira de adapter.alertasDaTela: nada aqui escolhe nem escreve alerta. Layout, cores,
   colunas, ordem e números não mudam. */
:root{
  --red:#E4002B; --gold:#FFC84A; --turq:#2EC4B6; --turq2:#7FE7DC;
  /* Etapa 4B — valores copiados do Desafio Q4 (painel-q4/src/app.tpl.html), que o Campari não importa:
     --negv  = o vermelho da diferença negativa do Q4 (#ffb3bd);
     --sk-*  = bloco Skyy (azul): título no --blued do Q4 (#0a2a6e, escurecido na 4E) e células no .pchip.t5 (rgba(29,123,255,.30),
               um pouco mais apagado porque aqui cobre um bloco inteiro, não um número);
     --pct-* = o quadradinho do % (.pchip do Q4): verde do --green/.pill.tot, vermelho do .pchip.t2.
     Etapa 4C — o bloco Aperitivo deixa de ser o amarelo escuro do Q4 e passa ao LARANJA do print do SAC
     (pedido da Karen em 09/11/2026, que viu a 4B num marrom-amarelado):
     --ap-tit = laranja médio do SAC (#E07B41) no título do bloco e nos cabeçalhos das colunas do Aperitivo;
     --ap-tit-fg = o texto deles. É ESCURO porque branco sobre #E07B41 dá contraste 2,97:1 (abaixo de 4,5:1) e
               o marrom bem escuro dá 5,3:1 — a decisão está registrada no PR da etapa 4C;
     Etapa 4D — só o CORPO do bloco Aperitivo clareia (pedido da Karen em 09/11/2026, vendo a 4C na tela): a 58%
     o laranja ficava forte e deixava a Dif. negativa (e o % laranja que havia então) em ~3,8:1, abaixo de 4,5:1. Título
     e cabeçalhos das colunas (--ap-tit/--ap-tit-fg) e o bloco Skyy inteiro não mudaram.
     --ap-cel = #E07B41 a 18% sobre o painel: o tom que a Karen escolheu em 09/11/2026, comparando os cinco
               candidatos na tela. Medido no print do Ranking GC em 1920x940, o corpo sai rgb(46,44,57), contra
               rgb(133,82,61) da 4C, e os textos sobem a branco 13,7:1 e Dif. negativa 8,1:1 — os dois
               bem acima de 4,5:1, sem trocar nenhuma cor de texto. Nesse tom o corpo quase não tem cor (sobre o
               azul-marinho do painel a tinta laranja rende um cinza morno): o laranja do bloco fica por conta do
               título e dos cabeçalhos das colunas. */
  --negv:#FFB3BD;
  --ap-tit:#E07B41; --ap-tit-fg:#2B1703; --ap-cel:rgba(224,123,65,.18);
  /* Etapa 4E — o bloco Skyy ganha o mesmo tratamento do Aperitivo (pedido da Karen em 09/11/2026): o azul do
     título fica mais escuro (--sk-tit, do #0A2A6E para #061C4D) e vale também para os cabeçalhos das COLUNAS do
     bloco; o texto deles é claro (--sk-tit-fg, 14:1 sobre o azul novo). */
  --sk-tit:#061C4D; --sk-tit-fg:#E8EEFB; --sk-cel:rgba(29,123,255,.20);
  --pct-ok-bg:rgba(34,177,76,.28); --pct-ok-fg:#C4FFD3;
  --pct-no-bg:rgba(194,40,64,.28); --pct-no-fg:#FFC2CC;
  --panel:rgba(9,26,52,.93); --line:rgba(255,255,255,.12); --muted:#B9BCC4; --ink:#FFFFFF;
  --chrome:rgba(6,22,44,.88);
  --ff:Inter,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',var(--ff);
}

:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

/* véu escuro só no rodapé: garante contraste do texto cinza sobre a parte clara da arte (pôr do sol / mar),
   sem cobrir o logo, o letreiro e a faixa de meses, que ficam no alto */
.bg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(6,22,44,0),rgba(6,22,44,.92))}
/* A faixa de cima (até ~148px) é da arte do fundo: logo, letreiro e meses. Nada é desenhado por cima dela. */

.info{position:absolute;right:60px;top:12px;text-align:right;line-height:1.1;display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:baseline;justify-items:end}
.info small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.info b{font-size:24px;font-weight:600;margin-bottom:3px}
.info .sim{grid-column:1/-1;margin-top:2px;padding:2px 10px;border-radius:6px;background:var(--gold);color:#2A1D00;font-size:13px;font-weight:700;letter-spacing:.06em}

.nav{position:absolute;left:60px;right:60px;top:148px;height:40px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.seg{display:flex;background:var(--chrome);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{display:inline-flex;align-items:center;padding:4px 16px;min-height:32px;border-radius:999px;font-size:16px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--red);color:#fff;box-shadow:0 0 18px rgba(228,0,43,.5)}
.seg button:not([aria-selected="true"]):hover{color:#fff}
.filtros{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:600;color:var(--muted);background:var(--chrome);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 16px}
.filtros label{display:flex;align-items:center;gap:8px}
.sel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.28);border-radius:9px;height:34px;padding:0 8px;font-size:16px;color:#fff;min-width:130px}
.sel option{background:#06162C;color:#fff}
.sel:disabled{opacity:.5}
.canais{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:2px}
.canais button{display:inline-flex;align-items:center;padding:4px 16px;min-height:32px;border-radius:999px;font-size:16px;font-weight:700;color:var(--muted)}
.canais button[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 0 14px rgba(228,0,43,.5)}

.faixa{position:absolute;left:60px;right:60px;top:196px;display:none;padding:8px 18px;border-radius:12px;font-size:17px;font-weight:600;border:1px solid}
.faixa.on{display:block}
.faixa.err{background:#4A0D17;border-color:#E8304A;color:#FFD0D8}
.faixa.warn{background:#3A2A00;border-color:#A47500;color:#FFE29A}
#stage.comfaixa .view{top:244px}

.view{position:absolute;left:60px;right:60px;top:198px;bottom:48px;display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.panel{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 22px;display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:none}
.ph h2{margin:0;font-family:var(--cond);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase}
.ph .nota{font-size:15px;color:var(--muted);text-align:right}
.rolar{flex:1;min-height:0;overflow:auto;overflow-x:hidden}
.aviso{display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:14px;background:rgba(46,196,182,.14);border:1px solid rgba(46,196,182,.4);font-size:16px;color:#D9FBF7;flex:none}

/* tabelas */
.tb{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tb th{font-size:13px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:var(--muted);text-align:center;padding:5px 5px;border-bottom:1px solid rgba(255,255,255,.18);white-space:nowrap;background:#0B1E3C;position:sticky;z-index:2}
.tb tr.grp th{top:0;border-bottom:none;text-align:center;font-family:var(--cond);font-weight:800;font-size:18px;letter-spacing:.04em;color:#fff;padding-bottom:0}
/* Etapa 4B: cor dos dois blocos (Ranking GC e Supervisão). O título leva o tom ESCURO e o corpo das células o tom
   BEM CLARO da mesma cor, pelo <colgroup> — assim nenhuma célula precisa de classe e o fundo claro fica embaixo
   do .k, do hover e da linha de total, que são todos semitransparentes. */
.tb tr.grp th.bl-ap{background:var(--ap-tit)}
.tb tr.grp th.bl-sk{background:var(--sk-tit)}
.tb colgroup.cg-ap{background:var(--ap-cel)}
.tb colgroup.cg-sk{background:var(--sk-cel)}
.tb tr.grp th small{font-family:var(--ff);font-size:13px;font-weight:600;color:var(--turq2);letter-spacing:.04em}
/* Etapa 4C: o laranja do Aperitivo vai também aos cabeçalhos das COLUNAS do bloco, e o texto deles é escuro
   (ver o cálculo de contraste na lista de variáveis). O bloco Skyy fica como estava. */
.tb tr.hdr th.hd-ap{background:var(--ap-tit)}
.tb tr.grp th.bl-ap,.tb tr.grp th.bl-ap small,.tb tr.hdr th.hd-ap{color:var(--ap-tit-fg)}
/* Etapa 4E: o mesmo no bloco Skyy — o azul escuro do título vai aos cabeçalhos das colunas, com texto claro. */
.tb tr.hdr th.hd-sk{background:var(--sk-tit)}
.tb tr.grp th.bl-sk,.tb tr.hdr th.hd-sk{color:var(--sk-tit-fg)}
.tb tr.hdr th{top:25px}
/* Etapa 4F: o conteúdo das células fica CENTRALIZADO em todas as tabelas de todas as abas, inclusive a coluna
   de identificação (Gerência, SV, Rota). A classe .l continua, só como marca dessa coluna (largura e colspan):
   o text-align:left que ela trazia saiu. */
.tb td{padding:5px 5px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;white-space:nowrap;color:#fff}
.tb td.sep,.tb th.sep{border-left:1px solid rgba(255,255,255,.16)}
.tb.g2 th.l:first-child,.tb.g2 td.l:first-child{width:200px}
.tb th.k,.tb td.k{background:rgba(255,255,255,.05)}
.tb tr.tot td{font-weight:700;border-top:2px solid var(--red);border-bottom:none;background:rgba(228,0,43,.07)}
.tb tr:hover td:not(.k){background:rgba(255,255,255,.03)}
/* As duas tabelas de ranking: fonte 1 px menor do que as de Consultor e Detalhe (nada abaixo de 13 px) e linhas
   mais justas (3 px em vez de 5 px em cima e embaixo). É o que faz as 16 gerências e o Total Band caberem sem
   rolagem no Ranking GC com a janela maximizada (~1920x940): com 5 px sobravam 62 px de rolagem. */
/* Etapa 4G: as linhas da tabela de dois grupos (Consultor e Detalhe do mês) ganham o mesmo respiro justo das de
   ranking (3 px em vez de 5 px em cima e embaixo). A fonte não muda (15 px, nada abaixo de 13 px): é só o que
   falta para uma página cheia — 15 linhas, a de total e as duas de cabeçalho — caber SEM ROLAGEM na janela
   maximizada (~1920x940), inclusive no Consultor, que ainda tem a faixa de aviso acima da tabela. */
.tb.g2 td,.tb.g2 th{padding-top:3px;padding-bottom:3px}
.tb.rk{font-size:14px}
.tb.rk td,.tb.rk th{padding-top:3px;padding-bottom:3px}
.tb.rk tr.grp th{font-size:17px}
.tb.rk .n{font-size:19px}
.tb.rk .cod{font-size:15px}
.cod{font-weight:700;font-size:16px}
.n{font-family:var(--cond);font-weight:800;font-size:20px;line-height:1}
/* Diferença negativa: vermelha (regras v1.6, seção 7; substitui o laranja). O seletor precisa do `td` para
   ganhar de `.tb td{color:#fff}`: só com `.neg` a cor não chegava à célula (era o caso do laranja da etapa 4). */
.tb td.neg{color:var(--negv)}
/* quadradinho do % de cobertura, como o quadro do % do Desafio Q4; a cor vem de motor.corDoPercentual */
.pchip{display:inline-block;border-radius:5px;padding:0 6px}
.pchip.verde{background:var(--pct-ok-bg);color:var(--pct-ok-fg)}
.pchip.vermelho{background:var(--pct-no-bg);color:var(--pct-no-fg)}
.hoje{display:inline-block;padding:1px 8px;border-radius:7px}
.hoje.ok{background:rgba(46,196,182,.22);color:var(--turq2);font-weight:700}
/* Etapa 4J: só a posição OFICIAL aparece nas tabelas de ranking (regras v1.10, seção 5); o seletor da outra
   coluna de posição, e o da cor cinza de quem não bateu os dois pilares, saíram da tela junto com ela. */
.of{color:var(--gold)}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--turq);color:#032B28}
.pill.no{background:rgba(255,255,255,.08);color:var(--muted)}

/* Etapa 4G: botões de navegação no rodapé da tabela (regras v1.7, seção 7). Só aparecem quando há mais de uma
   página; a página atual leva o vermelho do painel, como no print que a Karen enviou (‹ [1] 2 ›). */
.pag{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;padding-top:2px}
.pag button{min-width:34px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:15px;font-weight:700;color:var(--muted)}
.pag button:hover:not(:disabled){background:rgba(255,255,255,.12);color:#fff}
.pag button[aria-current="page"]{background:var(--red);color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(228,0,43,.45)}
.pag button:disabled{opacity:.35;cursor:default}
.pag .conta{margin-left:12px;font-size:14px;font-weight:500;color:var(--muted)}

/* regras: três colunas */
.rg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.rg section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-height:0}
.rg h2{margin:0;font-family:var(--cond);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase}
.rg .item{display:flex;gap:13px}
.rg .ic{flex:none;width:42px;height:42px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:800;font-size:22px}
.rg .item div{font-size:16px;line-height:1.4}

.rg .st{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px}
.rg .st.a{background:rgba(46,196,182,.12);border:1px solid rgba(46,196,182,.45)}
.rg .st.b{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}
.rg .st .pill{min-width:92px;text-align:center;padding:5px 14px;font-size:16px}
.rg .st div{font-size:16px;line-height:1.4}
.rg p{font-size:15px;line-height:1.5;color:#D7DBE3}
.rg .md{width:100%;border-collapse:collapse;font-size:15px}
.rg .md td{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top;line-height:1.4}
.rg .md td:first-child{width:112px;font-weight:700;color:var(--turq2)}
.al{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}

.al .erro{background:rgba(232,48,74,.16);border:1px solid #E8304A;color:#FFD0D8}
.al .aviso2{background:rgba(255,184,107,.14);border:1px solid rgba(255,184,107,.5);color:#FFE3C2}
.al .nota{background:rgba(255,255,255,.06);color:#D7DBE3}
.al b{display:block}

.foot{position:absolute;left:60px;right:60px;bottom:10px;font-size:14px;font-weight:500;line-height:1.25;color:var(--muted);display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.foot #rod{flex:none;text-align:right}
.vazio{margin:auto;text-align:center;font-size:20px;color:var(--muted);padding:40px}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div class="info" id="info"></div>

  <nav class="nav" aria-label="Abas do painel">
    <div class="seg" role="tablist" id="abas"></div>
    <div id="filtros"></div>
  </nav>

  <div class="faixa" id="faixa" role="alert"></div>

  <section class="view" id="v-gc" aria-label="Ranking das gerências"></section>
  <section class="view" id="v-sv" aria-label="Ranking das supervisões"></section>
  <section class="view" id="v-rt" aria-label="Consultor"></section>
  <section class="view" id="v-det" aria-label="Detalhe do mês"></section>
  <section class="view" id="v-regras" aria-label="Regras do incentivo"><div class="rg" id="rgbd"></div></section>

  <div class="foot"><span id="rodesq"></span><span id="rod"></span></div>
</div>

<script>/*
 * Motor de cálculo — Campari Club 2026 (Coca-Cola Bandeirantes) — regras v1.12 (docs/regras.md)
 * Roda em Node (testes) e no navegador (painel HTML): window.MotorCampari.
 *
 * Toda regra de cálculo do painel fica só aqui: nenhuma fórmula no adaptador nem na tela.
 * Etapa 2: ranking de volume de Aperitivo (% do mês, trava, soma, ordem e posição).
 * Etapa 3: gatilho de cobertura de Skyy, posição oficial, status "Bateu!", meta dia de cobertura, diferença e
 * "hoje atingiu a meta dia". A tela (Etapa 4) só lê o resultado: nenhuma comparação nem texto de motivo fora daqui.
 * Etapa 4: a regra de EXIBIÇÃO da meta dia de volume (`metaDiaVolume`, regras v1.4, decisão de 09/11/2026). Mesmo
 * sendo só exibição, é regra: fica aqui, não na tela.
 * Etapa 4B: a cor do quadradinho do % de cobertura (`corDoPercentual`, regras v1.6, seção 7). Também é só
 * exibição e também é regra: a tela pergunta a cor, nunca compara o número com 100.
 * Etapa 4C: a soma da gerência comercial agrupada do Ranking GC (`somarGrupo`, regras v1.6, seção 4 e pendência
 * 24). O agrupamento em si (quais gerências formam cada linha) é configuração do adaptador; a REGRA que mora aqui
 * é a de somar as medidas e só depois calcular — o % é o da soma, nunca a média dos % das gerências.
 * Etapa 4F: a cor do quadradinho do % do mês de Aperitivo (`corDoPercentualAperitivo`, regras v1.7, seção 7;
 * decisão da Karen de 09/11/2026). Exibição outra vez, e regra outra vez — e é regra DIFERENTE da do % de
 * cobertura: o verde começa no limite da TRAVA do mês e, no mês sem trava, em `REGRAS.corAperitivoSemTrava`,
 * nunca no mínimo do gatilho, que é de cobertura.
 * Etapa 4H: o segundo pilar de volume de Aperitivo e o gatilho dos DOIS PILARES (`gatilhoPilares`), regras
 * v1.8, seções 2, 5 e 7 (decisão da Karen de 09/11/2026, noite): "Bateu!" e a coluna da posição oficial passam a
 * exigir o gatilho de Skyy E o volume. O ranking (% Acum., ordem e Pos.) não muda.
 * Etapa 4I (regras v1.9, seção 7): só a versão muda aqui. A v1.9 tira a paginação da visão Gerência do Detalhe do
 * mês, que é apresentação (adaptador e tela); nenhuma regra de cálculo muda.
 * Etapa 4J (regras v1.10, seções 5 e 7): só a versão muda aqui outra vez. A v1.10 tira a coluna "Pos." das duas
 * tabelas de ranking, que é apresentação (tela): `numerarRanking` continua dando `pos` a todas as linhas — é ela
 * que ordena o ranking e entra no motivo do status —, e `numerarOficial` continua dando a coluna exibida.
 * Etapa 4K (regras v1.11, seções 2.2, 3 e 5; decisão da Karen de 10/11/2026): o volume de Aperitivo deixa de ter
 * GATILHO por média e passa a ter um MÍNIMO (`minimoVolume`, no lugar do `gatilhoVolume` da 4H): o % do MÊS
 * VIGENTE (o mês de referência da API) tem de chegar a `REGRAS.minimoVolume.minimo`, sem média e sem soma. A soma
 * dos % (out + nov + dez) continua sendo SÓ a pontuação do ranking. O gatilho de cobertura de Skyy não muda, nem a
 * ordem, o desempate, a soma e as posições premiadas: muda só a conta do segundo pilar — e, com ela, quem recebe
 * número na coluna RANK e quem tem "Bateu!".
 * Etapa 4L (regras v1.12; decisão da Karen de 10/11/2026): só a versão muda aqui. A v1.12 tira as premissas a
 * confirmar da aba Regras — elas ficam no documento de regras (seção 10) e no checklist —, e isso é tela
 * (adaptador: `alertasDaTela`). Nenhuma conta muda: a meta dia de volume continua comparando só o Real com a
 * Meta e a meta de volume nula continua deixando o mínimo indisponível.
 *
 * Escala: % em pontos percentuais, SEM arredondar (142.2631… = 142,26…%); a tela trunca depois (regras, seção 7).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MotorCampari = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const REGRAS = {
    versao: '1.12',
    meses: [10, 11, 12], // vigência: outubro, novembro e dezembro de 2026
    // Trava do % do mês de Aperitivo (regras, seção 3): 130% em outubro e novembro; dezembro sem trava (null).
    trava: { 10: 130, 11: 130, 12: null },
    // Limite do quadradinho VERDE do % do mês de Aperitivo no mês SEM trava (dezembro), em pontos percentuais
    // (regras v1.7, seção 7; ⚠️ pendência 25, a confirmar com a Karen). Nos meses com trava o limite é a própria
    // trava, por isso ele não se repete aqui. É outro número que o mínimo do gatilho, ainda que hoje coincidam:
    // um é volume de Aperitivo, o outro é cobertura de Skyy.
    corAperitivoSemTrava: 100,
    // Gatilho de cobertura de Skyy (regras, seção 2): média simples dos % de novembro e dezembro, mínimo 100%.
    // Outubro nunca entra. Em novembro o gatilho é parcial (só novembro).
    gatilho: { meses: [11, 12], minimo: 100 },
    // Mínimo de volume de Aperitivo (regras v1.11, seção 2.2; decisão da Karen de 10/11/2026, que substitui o
    // gatilho por média da v1.8): o % do MÊS VIGENTE — o mesmo % do ranking, já com a trava do mês — tem de chegar
    // a 100% no valor bruto. Não há meses nesta conta: não é média nem soma, é o mês vigente e só ele, por isso
    // a chave não tem `meses` (a soma dos % continua sendo a pontuação do ranking, seção 3).
    minimoVolume: { minimo: 100 },
    // Posições premiadas de cada nível (regras, seção 5), usadas SÓ para decidir o "Bateu!": o painel não mostra
    // prêmio nenhum. Padrão do motor, como o gatilhoPontos do Desafio Q4: a regra em vigor não depende de arquivo
    // que pode faltar ou ficar ilegível. `statusLinha(linha, nivel, cfg)` aceita outro cfg para mudança futura.
    premiadas: { gc: 6, svMista: 12, svSegmentada: 3 },
  };

  // Textos exatos dos motivos do status (regras, seção 5). Desde a v1.6 o motivo NÃO aparece na tela (a coluna
  // Status mostra só o selo), mas continua calculado aqui: motivo novo entra no motor, nunca no HTML.
  const MOTIVOS = {
    premiadas: 'dentro das premiadas',
    indisponivel: 'cobertura indisponível',
    semMeta: 'sem meta de cobertura',
    // regras v1.11 (mínimo de volume de Aperitivo); os textos de "volume em X%" saem de `gatilhoPilares`
    volumeIndisponivel: 'volume indisponível',
    semMetaVolume: 'sem meta de volume',
  };

  const numero = (v) => typeof v === 'number' && Number.isFinite(v);

  /**
   * % do mês = (Real + Online) ÷ Meta × 100, bruto (nunca o `atingimento_pct` inteiro da API).
   * Meta nula, não numérica ou ≤ 0: null (nunca 0 nem 100). Real não numérico: null.
   * Online ausente (null/undefined) conta 0: no mês fechado não existe online.
   */
  function percentualMes(real, online, meta) {
    if (!numero(meta) || meta <= 0) return null;
    if (!numero(real)) return null;
    if (online === null || online === undefined) online = 0;
    if (!numero(online)) return null;
    return ((real + online) / meta) * 100;
  }

  /**
   * Trava do mês sobre o % bruto: min(%, limite). Exatamente no limite não conta como travado.
   * Mês sem trava (dezembro): o próprio %. % null: { valor: null, travado: false }.
   * Mês fora da vigência: erro (nunca adivinhar a regra).
   */
  function aplicarTrava(pct, mes, regras) {
    regras = regras || REGRAS;
    if (!Object.prototype.hasOwnProperty.call(regras.trava, mes)) throw new Error(`mês ${mes} fora da vigência do Campari Club`);
    if (pct === null || pct === undefined) return { valor: null, travado: false };
    const limite = regras.trava[mes];
    if (limite === null || limite === undefined || pct <= limite) return { valor: pct, travado: false };
    return { valor: limite, travado: true };
  }

  /** Pontuação do ranking: soma dos % mensais já travados, só dos meses com %. Nenhum mês com %: null. */
  function somaRanking(valores) {
    const com = (valores || []).filter(numero);
    return com.length ? com.reduce((a, b) => a + b, 0) : null;
  }

  /**
   * Um participante (GC, SV ou rota) -> % de cada mês, trava, soma e marca de incompleta.
   * meses: [{ mes, situacao: 'dado' | 'indisponivel' | 'futuro', meta, real, online, ... }]
   *   - 'dado': o mês tem fonte (API no mês aberto ou fechado/AAAAMM.json); o % sai de Real + Online sobre a Meta;
   *   - 'indisponivel': o mês já devia ter dado e não tem (fechado ausente, produto ausente): sem %, linha incompleta;
   *   - 'futuro': mês posterior ao de referência: sem %, não conta na soma e não deixa a linha incompleta.
   * Devolve { meses (cópias com pct, pctTravado, travado), soma, incompleta, mesesSemPct }.
   * incompleta = algum mês que já devia contar ficou sem % (meta nula ou ≤ 0, ou mês indisponível) (premissa P4).
   */
  function apurarMeses(meses, regras) {
    regras = regras || REGRAS;
    const out = (meses || []).map((m) => {
      const pct = m.situacao === 'dado' ? percentualMes(m.real, m.online, m.meta) : null;
      const t = aplicarTrava(pct, m.mes, regras);
      return Object.assign({}, m, { pct, pctTravado: t.valor, travado: t.travado });
    });
    const mesesSemPct = out.filter((m) => m.situacao !== 'futuro' && m.pct === null).map((m) => m.mes);
    return { meses: out, soma: somaRanking(out.map((m) => m.pctTravado)), incompleta: mesesSemPct.length > 0, mesesSemPct };
  }

  /**
   * Soma das medidas de um grupo de linhas — a gerência comercial agrupada do Ranking GC (regras v1.6, seção 4;
   * decisão de 09/11/2026, pendência 24). É REGRA, não montagem de dados: a linha agrupada soma meta, real,
   * online (e a meta dia de volume) das gerências do grupo e só DEPOIS calcula, então o % é o da SOMA e nunca a
   * média dos % das gerências. Quem são as gerências de cada linha é configuração do adaptador, não daqui.
   *   - cada campo soma só os valores numéricos: gerência com meta null não zera a meta do grupo;
   *   - nenhum valor numérico no campo: null, nunca 0 (ausência de medida não é zero);
   *   - `campos` permite somar o bloco de cobertura, que não tem meta dia (['meta', 'real', 'online']).
   * A meta dia de volume do grupo é a soma das `meta_dia` publicadas pelas gerências, porque a API não publica
   * meta dia por grupo — premissa ⚠️ da seção 4 (b), a confirmar. A meta dia de COBERTURA não se soma: ela sai de
   * `metaDiaCobertura` sobre a meta e o real já somados.
   */
  function somarGrupo(valores, campos) {
    campos = campos || ['meta', 'real', 'online', 'metaDia'];
    const out = {};
    for (const campo of campos) {
      const nums = (valores || []).map((v) => (v ? v[campo] : null)).filter(numero);
      out[campo] = nums.length ? nums.reduce((a, b) => a + b, 0) : null;
    }
    return out;
  }

  /** Chave de desempate: o código (id da API) em minúsculas; comparação de texto simples ("sv.g2.10" < "sv.g2.2"). */
  const chaveCodigo = (codigo) => String(codigo).toLowerCase();

  /**
   * Ordem do ranking: soma desc; empate (inclusive soma null): código em minúsculas, texto simples (regras, seção 5).
   * Linha sem soma (nenhum mês com %) vai para o fim. Não altera a entrada; ordem estável.
   */
  function ordenarRanking(linhas) {
    return (linhas || []).map((l, i) => [l, i]).sort(([a, ia], [b, ib]) => {
      const sa = numero(a.soma) ? a.soma : null, sb = numero(b.soma) ? b.soma : null;
      if (sa !== sb) {
        if (sa === null) return 1;
        if (sb === null) return -1;
        return sb - sa;
      }
      const ca = chaveCodigo(a.codigo), cb = chaveCodigo(b.codigo);
      if (ca !== cb) return ca < cb ? -1 : 1;
      return ia - ib;
    }).map(([l]) => l);
  }

  /** Posição (coluna "Pos.") 1..n em todas as linhas, na ordem recebida. Devolve cópias. */
  function numerarRanking(linhas) {
    return (linhas || []).map((l, i) => Object.assign({}, l, { pos: i + 1 }));
  }

  /** Ordena e numera (atalho usado pelo adaptador). */
  const montarRanking = (linhas) => numerarRanking(ordenarRanking(linhas));

  /* ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
   * Etapa 3 — gatilho de cobertura de Skyy, posição oficial, status e meta dia de cobertura
   * ═════════════════════════════════════════════════════════════════════════════════════════════════════════ */

  /**
   * % de cobertura do mês = (realizado + online) ÷ meta × 100, bruto (regras, seção 2).
   * A conta é a mesma do volume, mas em função própria: a medida é cliente (não volume), a fonte é o bloco
   * `cobertura` e o motivo da falta é outro ("sem meta de cobertura").
   * Meta nula, não numérica ou ≤ 0: null, nunca 0 nem 100. Realizado não numérico: null.
   * Online ausente (null/undefined) conta 0 — no período de fechamento da API o `online_hoje` da cobertura vem null.
   */
  function percentualCobertura(real, online, meta) {
    if (!numero(meta) || meta <= 0) return null;
    if (!numero(real)) return null;
    if (online === null || online === undefined) online = 0;
    if (!numero(online)) return null;
    return ((real + online) / meta) * 100;
  }

  /** Diferença de uma medida no mês (regras, seção 7): Real + Online − Meta. Online ausente conta 0. */
  function diferenca(real, online, meta) {
    if (!numero(real) || !numero(meta)) return null;
    if (online === null || online === undefined) online = 0;
    if (!numero(online)) return null;
    return real + online - meta;
  }

  /** % truncado em 1 casa, com vírgula (a tela nunca arredonda o que a regra trunca): 99.99999 -> "99,9". */
  const pct1 = (v) => (Math.floor(v * 10 + 1e-9) / 10).toFixed(1).replace('.', ',');
  /** Número inteiro sem casas; com casas, vírgula decimal (usado no "precisa de 100%"). */
  const texto = (v) => (Number.isInteger(v) ? String(v) : String(v).replace('.', ','));

  /**
   * Gatilho do incentivo (regras, seção 2): média simples dos % de cobertura de Skyy dos meses de
   * `REGRAS.gatilho.meses` (novembro e dezembro), mínimo `REGRAS.gatilho.minimo` (100). Outubro nunca entra.
   *
   * meses:  [{ mes, situacao: 'dado' | 'indisponivel' | 'futuro', meta, real, online }] — o adaptador monta;
   *         'indisponivel' = o mês já devia ter cobertura e não tem (ex.: fechado/AAAAMM.json sem o campo).
   * mesRef: o mês da vigência que está valendo (10, 11 ou 12); null quando nenhum já começou.
   *
   * Devolve { valor, batido, parcial, indisponivel, motivo }:
   *   - novembro: `parcial` true e valor = % de novembro (dezembro ainda não existe);
   *   - dezembro: valor = (nov + dez) ÷ 2, e SÓ se os dois tiverem %; faltando um, indisponivel e valor null;
   *   - `batido` = valor ≥ mínimo no valor BRUTO (a tela trunca depois: 99,99999% não bate);
   *   - indisponivel -> motivo "cobertura indisponível" (mês sem fonte) ou "sem meta de cobertura" (meta nula ou ≤ 0).
   * Nunca assume valor: sem dado o gatilho fica indisponível, e a linha não recebe posição oficial.
   */
  function gatilhoCobertura(meses, mesRef, regras) {
    regras = regras || REGRAS;
    const semValor = (motivo) => ({ valor: null, batido: false, parcial: false, indisponivel: true, motivo });
    if (!numero(mesRef)) return semValor(MOTIVOS.indisponivel);
    const doGatilho = regras.gatilho.meses.filter((m) => m <= mesRef);
    if (!doGatilho.length) return semValor(MOTIVOS.indisponivel); // referência antes de novembro: o gatilho não começou
    const pcts = [];
    for (const m of doGatilho) {
      const d = (meses || []).find((x) => x && x.mes === m);
      if (!d || d.situacao !== 'dado') return semValor(MOTIVOS.indisponivel);
      const pct = percentualCobertura(d.real, d.online, d.meta);
      if (pct === null) return semValor(numero(d.meta) && d.meta > 0 ? MOTIVOS.indisponivel : MOTIVOS.semMeta);
      pcts.push(pct);
    }
    const valor = pcts.reduce((a, b) => a + b, 0) / pcts.length;
    return { valor, batido: valor >= regras.gatilho.minimo, parcial: doGatilho.length < regras.gatilho.meses.length,
             indisponivel: false, motivo: null };
  }

  /**
   * MÍNIMO de volume de Aperitivo (regras v1.11, seção 2.2; decisão da Karen de 10/11/2026, que substitui o
   * gatilho por média da v1.8): o % de Aperitivo do MÊS VIGENTE tem de chegar a `REGRAS.minimoVolume.minimo`
   * (100), comparado no valor BRUTO (99,99999% não bate; a tela trunca, a conta não arredonda).
   *
   * NÃO é média e NÃO é soma: entra um mês só, o vigente. A soma dos % de outubro, novembro e dezembro continua
   * sendo a pontuação do RANKING (seção 3) e não tem nada a ver com este corte.
   *
   * O % do mês é o MESMO do ranking: `percentualMes` + `aplicarTrava` (130% em outubro e novembro; dezembro sem
   * trava). A trava não muda o corte, porque o mínimo (100) é menor que ela — mas o % é o mesmo que a tela mostra.
   *
   * meses:  [{ mes, situacao: 'dado' | 'indisponivel' | 'futuro', meta, real, online }] — os mesmos meses que o
   *         adaptador entrega a `apurarMeses` para o ranking da linha.
   * mesRef: o MÊS VIGENTE, o mês de referência da API (10, 11 ou 12) — nunca o escolhido no seletor da tela;
   *         null quando nenhum mês da vigência começou.
   *
   * Devolve { valor, batido, indisponivel, motivo }, no molde de `gatilhoCobertura`, mas SEM `parcial`: sem média
   * não existe "parcial" (premissa (a) da pendência 26, confirmada em 10/11/2026).
   *   - `batido` = valor ≥ mínimo no valor BRUTO;
   *   - indisponível -> motivo "volume indisponível" (sem mês vigente, mês sem fonte, real não numérico) ou
   *     "sem meta de volume" (meta nula ou ≤ 0, ⚠️ pendência 26b). Nunca assume valor (nem 0, nem 100).
   */
  function minimoVolume(meses, mesRef, regras) {
    regras = regras || REGRAS;
    const semValor = (motivo) => ({ valor: null, batido: false, indisponivel: true, motivo });
    if (!numero(mesRef)) return semValor(MOTIVOS.volumeIndisponivel);
    const d = (meses || []).find((x) => x && x.mes === mesRef);
    if (!d || d.situacao !== 'dado') return semValor(MOTIVOS.volumeIndisponivel);
    const pct = percentualMes(d.real, d.online, d.meta);
    if (pct === null) return semValor(numero(d.meta) && d.meta > 0 ? MOTIVOS.volumeIndisponivel : MOTIVOS.semMetaVolume);
    const valor = aplicarTrava(pct, mesRef, regras).valor;
    return { valor, batido: valor >= regras.minimoVolume.minimo, indisponivel: false, motivo: null };
  }

  /** Pilar que falhou COM valor (não bateu e tem número): é o que gera "cobertura em X%" / "volume em X%". */
  const falhouComValor = (g) => !!g && !g.batido && !g.indisponivel && numero(g.valor);
  /** Pilar ausente (linha montada sem ele) conta como indisponível, nunca como batido. */

  /**
   * Os DOIS PILARES (regras v1.11, seções 2 e 5): junta o gatilho de cobertura de Skyy (`gatilhoCobertura`) e o
   * mínimo de volume de Aperitivo (`minimoVolume`) -> { batido, indisponivel, motivo }.
   *   - batido: só se os DOIS estiverem batidos;
   *   - indisponivel: algum dos dois indisponível E nenhum falhou com valor (um % abaixo do mínimo já decide);
   *   - motivo (só no motor; a tela mostra só o selo): null quando bateu os dois; "cobertura em X%: precisa de
   *     100%", "volume em X%: precisa de 100%" ou "cobertura em X% e volume em Y%: precisam de 100%" quando falha
   *     com valor (X e Y truncados em 1 casa); senão o motivo de "indisponível" do pilar que faltou (os dois,
   *     unidos por " e ", quando faltam os dois — premissa (d) da pendência 26, confirmada em 10/11/2026).
   * Pilar ausente conta como indisponível ("cobertura indisponível" / "volume indisponível"), nunca como batido.
   */
  function gatilhoPilares(gSkyy, mVolume, cfg) {
    const regras = cfg || REGRAS;
    const sk = ouIndisponivel(gSkyy, MOTIVOS.indisponivel), vo = ouIndisponivel(mVolume, MOTIVOS.volumeIndisponivel);
    if (sk.batido && vo.batido) return { batido: true, indisponivel: false, motivo: null };
    const fSk = falhouComValor(sk), fVo = falhouComValor(vo);
    const minSk = texto(regras.gatilho.minimo), minVo = texto(regras.minimoVolume.minimo);
    if (fSk && fVo) {
      const motivo = minSk === minVo
        ? `cobertura em ${pct1(sk.valor)}% e volume em ${pct1(vo.valor)}%: precisam de ${minSk}%`
        : `cobertura em ${pct1(sk.valor)}%: precisa de ${minSk}% e volume em ${pct1(vo.valor)}%: precisa de ${minVo}%`;
      return { batido: false, indisponivel: false, motivo };
    }
    if (fSk) return { batido: false, indisponivel: false, motivo: `cobertura em ${pct1(sk.valor)}%: precisa de ${minSk}%` };
    if (fVo) return { batido: false, indisponivel: false, motivo: `volume em ${pct1(vo.valor)}%: precisa de ${minVo}%` };
    // nenhum falhou com valor e nem os dois bateram: falta algum (ou os dois)
    const faltam = [sk, vo].filter((g) => !g.batido)
      .map((g, i) => g.motivo || (g === sk ? MOTIVOS.indisponivel : MOTIVOS.volumeIndisponivel));
    return { batido: false, indisponivel: true, motivo: faltam.join(' e ') };
  }

  /**
   * Posição oficial, a coluna "RANK" da tela (regras v1.11, seção 5): numera 1..k só quem bateu OS DOIS PILARES
   * (gatilho de Skyy E mínimo de volume de Aperitivo, `gatilhoPilares`), na ordem recebida — que é a do ranking
   * (`montarRanking`), já com a posição `pos` em todas as linhas. Quem bateu só um (ou nenhum) fica com `oficial`
   * null — sem posição oficial e, portanto, sem "Bateu!" — e quem está atrás sobe. Lê `linha.gatilho` e
   * `linha.minimoVolume`; pilar ausente não bateu. Devolve cópias, sem alterar a entrada.
   */
  function numerarOficial(linhas, cfg) {
    let n = 0;
    return (linhas || []).map((l) => {
      const bateu = !!l && gatilhoPilares(l.gatilho, l.minimoVolume, cfg).batido;
      return Object.assign({}, l, { oficial: bateu ? ++n : null });
    });
  }

  /**
   * Status da linha (regras v1.11, seção 5; decisão de 08/11/2026, no conceito do Desafio Q4) -> { status, motivo }.
   * "Bateu!" só com OS DOIS PILARES batidos (gatilho de Skyy E mínimo de volume de Aperitivo, `gatilhoPilares`)
   * E a posição oficial dentro das posições premiadas do nível (`REGRAS.premiadas`, nunca número fixo em lógica
   * nem em texto). Qualquer outro caso: "-".
   * O `motivo` é "dentro das premiadas", o de `gatilhoPilares` ("cobertura em X%: precisa de 100%", "volume em X%:
   * precisa de 100%", "cobertura em X% e volume em Y%: precisam de 100%", "cobertura indisponível", "sem meta de
   * cobertura", "volume indisponível", "sem meta de volume") ou "suba N posições" ("suba 1 posição" no
   * singular). Desde as regras
   * v1.6 (decisão de 09/11/2026) ele NÃO vai mais para a tela — a coluna Status mostra só o selo —, e continua
   * calculado aqui porque é regra e serve a quem consultar o resultado do motor. A tela acrescenta o "✓" do
   * "✓ Bateu!" e nunca mostra prêmio.
   * nivel: 'gc' | 'svMista' | 'svSegmentada'. Nível sem limite publicado: erro (nunca adivinhar o limite).
   */
  function statusLinha(linha, nivel, cfg) {
    const regras = cfg || REGRAS;
    if (!Object.prototype.hasOwnProperty.call(regras.premiadas, nivel)) {
      throw new Error(`nível ${nivel} sem posições premiadas no Campari Club`);
    }
    const p = gatilhoPilares(linha && linha.gatilho, linha && linha.minimoVolume, regras);
    if (!p.batido) return { status: '-', motivo: p.motivo };
    const oficial = linha ? linha.oficial : null;
    if (!numero(oficial)) return { status: '-', motivo: null }; // pilares batidos sem posição oficial (numerarOficial não rodou)
    const limite = regras.premiadas[nivel];
    if (oficial <= limite) return { status: 'Bateu!', motivo: MOTIVOS.premiadas };
    const n = oficial - limite;
    return { status: '-', motivo: `suba ${n} ${n === 1 ? 'posição' : 'posições'}` };
  }

  /**
   * Meta dia de COBERTURA (regras, seção 7; decisão de 08/11/2026): (Meta − Real) ÷ dias úteis restantes, com o
   * Real até ontem (D-1). É travada: não desconta o Online do dia, então não muda ao longo do dia.
   *   - Real ≥ Meta (meta batida): 0;
   *   - dias restantes ≤ 0 (dia não útil, ou o mês já sem dia útil pela frente): a diferença total (Meta − Real);
   *   - o resultado é em CLIENTES inteiros, arredondado para CIMA (cliente não se divide), com tolerância de
   *     1e-9 para 8,0000000001 não virar 9;
   *   - meta, real ou dias não numéricos: null (nunca 0 nem chute).
   * Volume não usa esta conta: o `meta_dia` de volume vem pronto da API e não se recalcula.
   */
  function metaDiaCobertura(meta, real, diasRestantes) {
    if (!numero(meta) || !numero(real) || !numero(diasRestantes)) return null;
    const falta = meta - real;
    if (falta <= 0) return 0;
    return Math.ceil((diasRestantes > 0 ? falta / diasRestantes : falta) - 1e-9);
  }

  /**
   * Meta dia de VOLUME, só na EXIBIÇÃO (regras v1.4, seção 7; decisão de 09/11/2026; pendência 15 resolvida).
   * A `meta_dia` de volume vem PRONTA da API e nunca é recalculada: esta função só decide o que a tela mostra.
   *   - Real > Meta (meta do mês já batida): 0;
   *   - `meta_dia` negativa (a API publica negativos nas rotas com a meta batida, iguais aos do SAC): 0;
   *   - `meta_dia` não numérica (API em período de fechamento): null, que a tela mostra como "—".
   * A comparação usa só o Real (até ontem), SEM o Online — premissa a confirmar das regras v1.4, seção 7
   * (pendência 22): ela fica registrada SÓ no documento de regras desde a v1.12, não mais na tela, e o motor
   * segue a regra descrita ali sem decidir por conta própria.
   * A meta dia de COBERTURA não passa por aqui: `metaDiaCobertura` já devolve 0 com a meta batida e um inteiro
   * para cima (valor entre 0 e 1 vira 1), que é o que a v1.4 pede para ela.
   */
  function metaDiaVolume(metaDia, real, meta) {
    if (!numero(metaDia)) return null;
    if (numero(real) && numero(meta) && real > meta) return 0;
    if (metaDia < 0) return 0;
    return metaDia;
  }

  /**
   * Cor do quadradinho do % de cobertura de Skyy ("% do mês" e "% Acumulado" das tabelas de ranking; regras v1.6,
   * seção 7, decisão de 09/11/2026). É exibição, mas é regra: a tela pergunta a cor e nunca compara nada.
   *   - 'verde'    -> o valor BRUTO é ≥ ao mínimo do gatilho (`REGRAS.gatilho.minimo`);
   *   - 'vermelho' -> o valor bruto está abaixo desse mínimo;
   *   - null       -> sem valor ("—"): a tela não desenha quadradinho nenhum.
   * A comparação é no valor BRUTO, nunca no truncado da tela: 99,99999% aparece como "99,9%" e fica VERMELHO,
   * porque não bate o mínimo. O mínimo sai de `REGRAS` (ou do `cfg` de uma mudança futura), nunca fixo aqui.
   * Só o % de cobertura usa isto: os % mensais de Aperitivo (Out, Nov, Dez, Soma) não têm quadradinho.
   */
  function corDoPercentual(valor, cfg) {
    const regras = cfg || REGRAS;
    if (!numero(valor)) return null;
    return valor >= regras.gatilho.minimo ? 'verde' : 'vermelho';
  }

  /**
   * Cor do quadradinho do % do MÊS de Aperitivo (regras v1.7, seção 7; decisão da Karen de 09/11/2026). Vale só
   * para a coluna do mês vigente das tabelas de ranking e para o % do Consultor e do Detalhe do mês: a tela
   * pergunta a cor e nunca compara nada.
   *   - 'verde'    -> o valor BRUTO chega ao limite do mês: a trava (`REGRAS.trava[mes]`) nos meses travados e
   *                   `REGRAS.corAperitivoSemTrava` no mês sem trava (dezembro) — ⚠️ pendência 25;
   *   - 'vermelho' -> o valor bruto está abaixo desse limite;
   *   - null       -> sem valor ("—"): a tela não desenha quadradinho nenhum.
   * A comparação é no valor BRUTO, nunca no truncado da tela: 129,99999% aparece como "129,9%" e fica VERMELHO.
   * Mês fora da vigência: erro, como em `aplicarTrava` (nunca adivinhar o limite de um mês que não existe).
   * O % ACUMULADO de Aperitivo (a soma do ranking) não tem quadradinho: esta função não serve a ele.
   */
  function corDoPercentualAperitivo(valor, mes, cfg) {
    const regras = cfg || REGRAS;
    if (!Object.prototype.hasOwnProperty.call(regras.trava, mes)) throw new Error(`mês ${mes} fora da vigência do Campari Club`);
    if (!numero(valor)) return null;
    const trava = regras.trava[mes];
    const limite = trava === null || trava === undefined ? regras.corAperitivoSemTrava : trava;
    return valor >= limite ? 'verde' : 'vermelho';
  }

  /**
   * "Hoje" colorido (regras, seção 7; pendência 17, confirmada em 08/11/2026): Online > 0 E Online ≥ Meta dia.
   * Meta dia 0 com Online > 0 colore; meta dia 0 com Online 0 não colore; meta dia null (API em período de
   * fechamento, ou cobertura sem meta) não colore. Serve para volume (`meta_dia` da API) e para cobertura
   * (`metaDiaCobertura`): a tela só lê o resultado, não compara nada. A meta dia que entra aqui é a EXIBIDA
   * (`metaDiaVolume` no volume), para a cor do "Hoje" concordar com o número que está na coluna ao lado.
   */
  function hojeAtingiu(online, metaDia) {
    if (!numero(online) || online <= 0) return false;
    if (!numero(metaDia)) return false;
    return online >= metaDia;
  }

  return { versaoRegras: REGRAS.versao, REGRAS, MOTIVOS, percentualMes, aplicarTrava, somaRanking, apurarMeses,
           somarGrupo, ordenarRanking, numerarRanking, montarRanking, chaveCodigo, percentualCobertura, diferenca,
           gatilhoCobertura, minimoVolume, gatilhoPilares, numerarOficial, statusLinha, metaDiaCobertura, metaDiaVolume, corDoPercentual,
           corDoPercentualAperitivo, hojeAtingiu };
});

<script>/*
 * Adaptador do painel Campari Club: API -> motor.
 * Fonte: a API publicada no mesmo site (./api/v1/). Lê o index.json, localiza os dois produtos do incentivo
 * (agrupadores extras "Aperitivo" e "Skyy"), carrega cada mês da vigência pela fonte certa (API no mês aberto,
 * fechado/AAAAMM.json nos meses encerrados; a cobertura segue outra regra de fonte), aplica o canal do SV e
 * entrega os números ao motor, que devolve %, trava, soma, ordem, gatilho, posição oficial e status.
 * Não calcula regra: %, trava, soma, ordem e posição são do motor (src/motor.js). Nunca inventa valor: o que falta
 * vira motivo ou aviso.
 */
const CONFIG = {
  ano: 2026,          // ano do incentivo
  meses: [10, 11, 12], // vigência: outubro, novembro e dezembro
  api: './api/v1/',
  ajustes: './ajustes.json', // ajustes do admin publicados (só `canais` e `canaisSV` interessam ao Campari)
  // Papel no incentivo -> nome EXATO do agrupador do modelo SAP (maiúsculas e acentos contam).
  // O id do produto na API não é fixo: é achado em index.json -> produtos pelo campo `agrupadores`.
  agrupadores: { aperitivo: 'Aperitivo', skyy: 'Skyy' },
  // Ranking GC pela GERÊNCIA COMERCIAL AGRUPADA do SAC (regras v1.6, seção 4; decisão de 09/11/2026, pendência
  // 24): código da LINHA do ranking -> gerências da API que ela soma. Oito linhas têm uma gerência só e quatro
  // somam duas, dando 12 linhas no lugar das 16 gerências da API. Fica em configuração, nunca na lógica:
  // gerência publicada e fora deste mapa entra como linha própria, com aviso, e gerência do mapa que a API não
  // publicou simplesmente não entra na soma, também com aviso.
  gruposGC: {
    G1: ['G1'], G2: ['G2'], G3: ['G3'], AP: ['AP'], AT: ['AT'], AN: ['AN'], RV: ['RV'], SL: ['SL'],
    UR_RI: ['UR', 'RI'], IT_MO: ['IT', 'MO'], PA_DI: ['PA', 'DI'], GU_PO: ['GU', 'PO'],
  },
  // Linhas por página das tabelas paginadas (etapa 4G; regras v1.7, seção 7). Fica em configuração, nunca na
  // lógica nem na tela: a Supervisão, o Consultor e a visão Supervisão do Detalhe do mês pedem a fatia a
  // `fatiar`, que lê este número. A linha de total (Total Band ou Total da mesa) NÃO entra na conta: ela se
  // repete em toda página.
  linhasPorPagina: 15,
  // Visões do Detalhe do mês que NÃO são paginadas (etapa 4I; decisão da Karen de 09/11/2026, pendência 27): a
  // visão Gerência mostra todas as linhas e o Total Band numa tela só; a visão Supervisão continua em páginas de
  // `linhasPorPagina`. Quem decide é `paginaDoDetalhe`, que só escolhe o tamanho e chama `fatiar`.
  detalheSemPaginacao: ['gc'],
};

/*
 * Acha os produtos do incentivo em index.json -> produtos. Um produto casa com um papel quando é extra
 * (`extra: true`) e o seu `agrupadores` é exatamente [nome do CONFIG] (um único agrupador, grafia exata).
 * Devolve { ok, ids: {aperitivo, skyy}, motivos: [...] }; ok só quando os dois foram achados sem ambiguidade.
 */
function localizarProdutos(index, cfg) {
  cfg = cfg || CONFIG;
  const papeis = Object.keys(cfg.agrupadores);
  const ids = Object.fromEntries(papeis.map((p) => [p, null]));
  const produtos = index && Array.isArray(index.produtos) ? index.produtos : null;
  if (!produtos) return { ok: false, ids, motivos: ['index.json sem a lista de produtos'] };
  const motivos = [];
  for (const papel of papeis) {
    const nome = cfg.agrupadores[papel];
    const comNome = produtos.filter((p) => p && Array.isArray(p.agrupadores) && p.agrupadores.includes(nome));
    const validos = comNome.filter((p) => p.extra === true && p.agrupadores.length === 1 && typeof p.id === 'string' && p.id);
    if (validos.length === 1) { ids[papel] = validos[0].id; continue; }
    if (validos.length > 1) motivos.push(`agrupador "${nome}" em mais de um produto (${validos.map((p) => p.id).join(', ')})`);
    else if (!comNome.length) motivos.push(`agrupador "${nome}" não publicado na API`);
    else if (comNome.some((p) => p.extra !== true)) motivos.push(`agrupador "${nome}" num produto sem "extra": true`);
    else motivos.push(`agrupador "${nome}" somado a outros agrupadores no mesmo produto`);
  }
  return { ok: motivos.length === 0, ids, motivos };
}

/*
 * Lê ./api/v1/index.json (cache: no-cache) e devolve o que a tela usa nesta etapa:
 * { ok, erro, mesReferencia, fechados, atualizadoEm, simulado, produtos } (produtos = localizarProdutos).
 * Falha de leitura (rede, HTTP ≠ 200, JSON inválido): ok false e o motivo em `erro`, sem nenhum valor inventado.
 */
async function carregarDados(base, fetchFn) {
  base = base || CONFIG.api;
  fetchFn = fetchFn || (typeof fetch === 'function' ? fetch : null);
  const vazio = { ok: false, erro: null, mesReferencia: null, fechados: [], atualizadoEm: null, simulado: false, produtos: null };
  let index;
  try {
    if (!fetchFn) throw new Error('fetch indisponível');
    const r = await fetchFn(base + 'index.json', { cache: 'no-cache' });
    if (!r || r.status !== 200) throw new Error(`HTTP ${r ? r.status : '?'}`);
    index = await r.json();
    if (!index || typeof index !== 'object' || Array.isArray(index)) throw new Error('conteúdo não é um objeto JSON');
  } catch (e) {
    return Object.assign(vazio, { erro: `index.json: ${e.message}` });
  }
  return {
    ok: true,
    erro: null,
    mesReferencia: index.mes_referencia || null,
    fechados: Array.isArray(index.fechados) ? index.fechados : [],
    atualizadoEm: index.atualizado_em || null,
    simulado: index.simulado === true,
    produtos: localizarProdutos(index),
  };
}


/* ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════
 * Etapa 2 — dados do ranking de volume de Aperitivo
 * ═════════════════════════════════════════════════════════════════════════════════════════════════════════════ */

/** Motor: no painel vem de window.MotorCampari; no Node, de motor.js. */
const MotorCampariAqui = () => (typeof MotorCampari !== 'undefined' ? MotorCampari : require('./motor.js'));
/** Base de canais (cópia da base embutida do Q4): no painel vem embutida pelo build; no Node, de data/data.json. */
const BaseCanaisAqui = () => (typeof BASE_CANAIS_CAMPARI !== 'undefined' ? BASE_CANAIS_CAMPARI : require('../data/data.json'));

const NOMES_MES = ['', 'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const anomesDe = (ano, mes) => String(ano) + String(mes).padStart(2, '0');
/** Código da linha da empresa (Diretoria e GP; regras, seção 4): o rótulo do mockup, sem nome de pessoa. */
const TOTAL_BAND = 'Total Band';

/* ─── Canal das rotas e do SV: CÓPIA de painel-q4/src/adapter.js (premissa P3; nada é importado de lá) ───────────
 * titulo, svNome, SEGMENTOS, ehObjeto, textoOk, validarCanalRota e mapaCanal: cópias literais.
 * canaisDosSVs: cópia com UMA diferença — SV sem nenhuma rota com canal na mesa (no Q4 ele nem aparece, porque as
 * rotas sem canal ficam fora) sai com origem 'sem canal' em vez de 'empate'. Rota sem canal não vota.
 * Extração para uma pasta comum: proposta para uma etapa futura. */
const titulo = (s) => s.charAt(0) + s.slice(1).toLowerCase(); // 'AN' -> 'An'
const svNome = (sv) => sv.replace(/^SV\.([A-Z0-9]+)\.(\d+)$/, (_, g, n) => `Sv. ${titulo(g)}.${n}`); // 'SV.AN.1' -> 'Sv. An.1'
const SEGMENTOS = { Mista: [], Segmentada: ['Mini', 'Mod'], '': ['Neutraliza', 'Eventual', 'Coke Net', 'Virtual'] };
const ehObjeto = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
const textoOk = (s, n) => typeof s === 'string' && s.trim().length > 0 && s.trim().length <= n && !/[\u0000-\u001f\u007f]/.test(s);

/** Canal e segmento de uma rota no ajustes.json -> {canal, sub}; inválido é ignorado e vira aviso, nunca em silêncio. */
function validarCanalRota(rota, c, avisos) {
  const av = (t) => { if (avisos) avisos.push(`rota ${rota}: ${t}`); };
  if (!c || typeof c !== 'object' || !(c.canal === null || c.canal === 'Mista' || c.canal === 'Segmentada')) {
    av(`canal ${JSON.stringify(c && typeof c === 'object' ? c.canal : c)} não é Mista, Segmentada nem sem canal (null): ajuste ignorado`);
    return null;
  }
  const seg = c.segmento !== undefined && c.segmento !== null ? c.segmento : c.sub;
  if (seg === undefined || seg === null || seg === '') return { canal: c.canal, sub: null };
  if (SEGMENTOS[c.canal || ''].includes(seg)) return { canal: c.canal, sub: seg };
  av(`segmento ${JSON.stringify(seg)} não vale para ${c.canal || 'sem canal'}: segmento ignorado, canal mantido`);
  return { canal: c.canal, sub: null };
}

/** Canal de cada rota: o da base de segmentação, trocado pelos ajustes do admin (`canais`). `sub` é o segmento. */
function mapaCanal(base, canais) {
  const canal = {};
  base.rotas.forEach((r) => { canal[r.rota] = { canal: r.canal, sub: r.sub, origem: 'base' }; });
  for (const [rota, c] of Object.entries(canais || {})) canal[rota] = Object.assign({}, c, { origem: 'ajuste' });
  return canal;
}

/** Canal do SV: o do admin (canaisSV) ou a maioria das rotas da mesa com canal; empate sem escolha: canal null. */
function canaisDosSVs(rotas, ajusteSV) {
  const cont = {};
  for (const r of rotas || []) {
    if (!r.sv) continue;
    const c = (cont[r.sv] = cont[r.sv] || { Mista: 0, Segmentada: 0 });
    if (r.canal in c) c[r.canal]++;
  }
  const out = {};
  for (const [sv, c] of Object.entries(cont)) {
    const aj = ajusteSV && ajusteSV[sv];
    const semVoto = c.Mista + c.Segmentada === 0; // diferença do Q4: mesa sem nenhuma rota com canal
    const maioria = c.Mista === c.Segmentada ? null : c.Mista > c.Segmentada ? 'Mista' : 'Segmentada';
    out[sv] = { canal: aj || maioria, padrao: maioria,
                origem: aj ? 'ajuste' : maioria ? 'maioria' : semVoto ? 'sem canal' : 'empate',
                rotas: c, misto: c.Mista > 0 && c.Segmentada > 0 };
  }
  return out;
}
/* ─── fim da cópia ─────────────────────────────────────────────────────────────────────────────────────────── */

/**
 * `canais` e `canaisSV` de um ajustes.json já lido (objeto) -> { canais, canaisSV, avisos }. Mesma validação do Q4
 * (cópia do trecho de normalizarAjustes); o resto do arquivo não interessa ao Campari.
 */
function ajustesDeCanal(aj) {
  const avisos = [], canais = {}, canaisSV = {};
  if (!ehObjeto(aj)) return { canais, canaisSV, avisos };
  if (aj.canais !== undefined && !ehObjeto(aj.canais)) avisos.push('canais: precisa ser um objeto: ignorado');
  if (aj.canaisSV !== undefined && !ehObjeto(aj.canaisSV)) avisos.push('canaisSV: precisa ser um objeto: ignorado');
  for (const [rota, c] of Object.entries(ehObjeto(aj.canais) ? aj.canais : {})) {
    const v = validarCanalRota(rota, c, avisos);
    if (v) canais[rota] = v;
  }
  for (const [sv, c] of Object.entries(ehObjeto(aj.canaisSV) ? aj.canaisSV : {})) {
    if (textoOk(sv, 120) && (c === 'Mista' || c === 'Segmentada')) canaisSV[sv] = c;
    else avisos.push(`SV ${sv}: canal do SV ${JSON.stringify(c)} não é Mista nem Segmentada: ajuste ignorado`);
  }
  return { canais, canaisSV, avisos };
}

/**
 * Lê o ajustes.json PUBLICADO (o Campari não tem Administração nem ajustes do navegador).
 * 404: ninguém publicou, vale a base. Ilegível ou HTTP ≠ 200/404: nenhum ajuste vale, com aviso (como no Q4).
 */
async function lerAjustes(fetchFn, cfg) {
  cfg = cfg || CONFIG;
  const vazio = (situacao, aviso) => ({ situacao, canais: {}, canaisSV: {}, avisos: aviso ? [aviso] : [] });
  let r;
  try { r = await fetchFn(cfg.ajustes, { cache: 'no-cache' }); } catch (e) {
    return vazio('sem-acesso', `ajustes.json não pôde ser lido (${e.message}): canais só da base embutida`);
  }
  if (r && r.status === 404) return vazio('ausente', null);
  if (!r || r.status !== 200) return vazio('erro', `ajustes.json ilegível (HTTP ${r ? r.status : '?'}): nenhum ajuste publicado vale`);
  let aj;
  try { aj = await r.json(); } catch (e) { return vazio('erro', `ajustes.json ilegível (${e.message}): nenhum ajuste publicado vale`); }
  if (!ehObjeto(aj)) return vazio('erro', 'ajustes.json ilegível (o conteúdo não é um objeto JSON): nenhum ajuste publicado vale');
  return Object.assign({ situacao: 'ok' }, ajustesDeCanal(aj));
}

/**
 * Fonte de cada mês da vigência (premissa P1), com ref = index.json -> mes_referencia.anomes:
 *   - mês anterior a ref, ou mês = ref com mes_referencia.fechamento = true: fechado/AAAAMM.json (só Real, Online 0);
 *     sem o arquivo na lista `fechados`: 'indisponivel' (nunca usa a API de outro mês no lugar);
 *   - mês = ref sem fechamento: 'api' (Real + online_hoje);
 *   - mês posterior a ref: 'futuro' (sem dado, não conta na soma).
 * Devolve [{ mes, anomes, fonte: 'api' | 'fechado' | 'indisponivel' | 'futuro', arquivo, motivo }].
 */
function fontesDosMeses(index, cfg) {
  cfg = cfg || CONFIG;
  const ref = String(index.mes_referencia.anomes), fech = index.mes_referencia.fechamento === true;
  const lista = Array.isArray(index.fechados) ? index.fechados : [];
  return cfg.meses.map((mes) => {
    const anomes = anomesDe(cfg.ano, mes);
    if (anomes > ref) return { mes, anomes, fonte: 'futuro', arquivo: null, motivo: null };
    if (anomes < ref || fech) {
      const item = lista.find((x) => x && x.anomes === anomes);
      if (item && typeof item.arquivo === 'string') return { mes, anomes, fonte: 'fechado', arquivo: item.arquivo, motivo: null };
      return { mes, anomes, fonte: 'indisponivel', arquivo: null, motivo: `${NOMES_MES[mes]} não está nos meses fechados da API` };
    }
    return { mes, anomes, fonte: 'api', arquivo: null, motivo: null };
  });
}

/**
 * Fonte da COBERTURA de cada mês (premissa P1) — diferente da do volume, de propósito:
 *   - mês = ref, aberto OU em período de fechamento da API: os blocos `cobertura` da própria API ('api'), porque
 *     a cobertura do mês de referência continua publicada lá mesmo quando o volume já vem do fechado/;
 *     `fechamento` marca a janela em que a API devolve `online_hoje` null e não há meta dia;
 *   - mês anterior a ref: 'fechado' (o arquivo do mês), que hoje NÃO traz cobertura (pendência 10 das regras);
 *   - mês posterior a ref: 'futuro'.
 * Devolve [{ mes, anomes, fonte: 'api' | 'fechado' | 'futuro', arquivo, motivo, fechamento }].
 */
function fontesDaCobertura(index, cfg) {
  cfg = cfg || CONFIG;
  const ref = String(index.mes_referencia.anomes), fech = index.mes_referencia.fechamento === true;
  const lista = Array.isArray(index.fechados) ? index.fechados : [];
  return cfg.meses.map((mes) => {
    const anomes = anomesDe(cfg.ano, mes);
    if (anomes > ref) return { mes, anomes, fonte: 'futuro', arquivo: null, motivo: null, fechamento: false };
    if (anomes === ref) return { mes, anomes, fonte: 'api', arquivo: null, motivo: null, fechamento: fech };
    const item = lista.find((x) => x && x.anomes === anomes);
    return { mes, anomes, fonte: 'fechado', fechamento: false, motivo: null,
             arquivo: item && typeof item.arquivo === 'string' ? item.arquivo : null };
  });
}

/**
 * Cobertura de um mês fechado -> { meta, real } por nível, ou null quando o arquivo não traz cobertura.
 *
 * PORTA ÚNICA da pendência 10 das regras: o `fechado/AAAAMM.json` de hoje tem `campos_produto: ["meta",
 * "realizado"]` e NENHUM campo de cobertura; o formato do campo novo ainda não existe — o Matheus vai incluí-lo
 * até 01/12/2026. Até lá esta função devolve null para qualquer arquivo, e o mês de cobertura fica
 * "indisponível" (sem gatilho, sem posição oficial, com aviso). Nada é adivinhado: quando o campo existir, é
 * só aqui que ele entra, e só aqui que os testes precisam mudar.
 * Em dezembro isso significa gatilho indisponível para todos, porque novembro já será mês fechado.
 */
// Os três parâmetros já são os definitivos (arquivo do mês, anomes e id do produto): só o corpo muda na pendência 10.
function coberturaDoFechado(fechado, anomes, pid) {
  return null;
}

const VAZIO = () => ({ meta: null, real: null, online: null, metaDia: null });
/** Bloco de produto da API (mês aberto) -> valores do mês. Produto ausente no bloco: tudo null. */
const doBlocoApi = (b) => (b ? { meta: b.meta, real: b.realizado, online: b.online_hoje, metaDia: b.meta_dia } : VAZIO());
/**
 * Bloco `cobertura` de um produto da API -> { meta, real, online } (premissa P2: os números como a API publica,
 * sem recalcular soma de rotas). Produto ausente, ou produto sem o bloco `cobertura` (modelo sem as colunas):
 * null, que vira mês "indisponível" — diferente de `cobertura.meta` null, que é "sem meta de cobertura".
 */
const doBlocoCobertura = (b) => {
  const c = b && ehObjeto(b.cobertura) ? b.cobertura : null;
  return c ? { meta: c.meta, real: c.realizado, online: c.online_hoje } : null;
};
/** Par [meta, realizado] do fechado -> valores do mês (sem online nem meta dia no fechamento: online 0). */
const doPar = (par, iMeta, iReal) => (Array.isArray(par) ? { meta: par[iMeta], real: par[iReal], online: 0, metaDia: null } : VAZIO());
const ehEventual = (rota) => /-EV$/.test(String(rota)); // rota oculta com o Real das rotas EV* (M.rota_eventuais)
const somaOuNull = (vs) => { const c = vs.filter((v) => typeof v === 'number'); return c.length ? c.reduce((a, b) => a + b, 0) : null; };

/**
 * Lê um fechado/AAAAMM.json para o produto `pid`: { ok, motivo, estado, simulado, gc: {GC: valores} | null,
 * empresa: valores | null, sv: {SV: valores}, gcDoSv: {SV: GC}, rotas: [{rota, gc, sv, valores}] }.
 * GC vem de totais.gerencias e o Total Band de totais.empresa (sem os totais: nível indisponível no mês,
 * nunca soma rotas); SV é a soma das linhas de `rotas` pelo campo supervisão (todas as rotas da mesa, premissa P2).
 */
function lerFechado(f, anomes, pid) {
  if (!ehObjeto(f)) return { ok: false, motivo: 'arquivo ilegível' };
  if (f.anomes !== anomes) return { ok: false, motivo: `o arquivo traz o mês ${f.anomes}` };
  const col = (n) => (f.campos || []).indexOf(n), cp = (n) => (f.campos_produto || []).indexOf(n);
  const [iRota, iGer, iSv, iProd, iMeta, iReal] = [col('rota'), col('gerencia'), col('supervisao'), col('produtos'), cp('meta'), cp('realizado')];
  if ([iRota, iGer, iSv, iProd, iMeta, iReal].some((x) => x < 0) || !Array.isArray(f.rotas)) return { ok: false, motivo: 'formato inesperado' };
  const temTotais = ehObjeto(f.totais) && ehObjeto(f.totais.gerencias) && ehObjeto(f.totais.empresa);
  const temProduto = (temTotais && f.totais.empresa[pid] !== undefined) || f.rotas.some((l) => ehObjeto(l[iProd]) && l[iProd][pid] !== undefined);
  if (!temProduto) return { ok: false, motivo: 'o arquivo não traz o produto Aperitivo' };
  const gc = temTotais ? Object.fromEntries(Object.keys(f.totais.gerencias).map((g) => [g, doPar((f.totais.gerencias[g] || {})[pid], iMeta, iReal)])) : null;
  const porSv = {}, gcDoSv = {}, rotas = [];
  for (const l of f.rotas) {
    const v = doPar((l[iProd] || {})[pid], iMeta, iReal);
    (porSv[l[iSv]] = porSv[l[iSv]] || []).push(v);
    if (!gcDoSv[l[iSv]]) gcDoSv[l[iSv]] = l[iGer];
    if (!ehEventual(l[iRota])) rotas.push({ rota: l[iRota], gc: l[iGer], sv: l[iSv], valores: v });
  }
  const sv = {};
  for (const [id, vs] of Object.entries(porSv)) {
    sv[id] = { meta: somaOuNull(vs.map((v) => v.meta)), real: somaOuNull(vs.map((v) => v.real)), online: 0, metaDia: null };
  }
  return { ok: true, motivo: temTotais ? null : 'sem totais por gerência', estado: f.fechamento_final === true ? 'oficial' : 'previa',
           simulado: f.simulado === true, gc, empresa: temTotais ? doPar(f.totais.empresa[pid], iMeta, iReal) : null,
           sv, gcDoSv, rotas };
}

/**
 * Linhas do Ranking GC pela gerência comercial agrupada (regras v1.6, seção 4; decisão de 09/11/2026).
 * `codigos` = as gerências que a API publicou (index.json -> gerencias, mais as que só aparecem num mês fechado).
 * O mapa é `cfg.gruposGC`: código da linha -> gerências que ela soma. Nada é fixo aqui.
 * Devolve { grupos: [{ codigo, gerencias, faltantes, agrupada, foraDoMapa }], avisos: [...] }:
 *   - gerência do mapa que a API não publicou: fica em `faltantes`, o grupo sai só com as que existem, com aviso;
 *   - grupo sem nenhuma gerência publicada: não entra no ranking, com aviso (nunca uma linha de zeros);
 *   - gerência publicada e fora do mapa: linha própria (`foraDoMapa`), com aviso — o ranking nunca esconde uma
 *     gerência que a API passou a publicar.
 * A ordem não importa: o motor ordena pela Soma e desempata pelo código da linha em minúsculas ("ur_ri").
 */
function gruposDoRankingGC(codigos, cfg) {
  cfg = cfg || CONFIG;
  const mapa = ehObjeto(cfg.gruposGC) ? cfg.gruposGC : {};
  const publicadas = Array.isArray(codigos) ? codigos.slice() : [];
  const grupos = [], avisos = [], usadas = {};
  for (const [codigo, membros] of Object.entries(mapa)) {
    const lista = Array.isArray(membros) ? membros : [];
    const gerencias = lista.filter((g) => publicadas.indexOf(g) >= 0);
    const faltantes = lista.filter((g) => publicadas.indexOf(g) < 0);
    for (const g of gerencias) usadas[g] = true;
    if (!gerencias.length) {
      avisos.push(`a linha ${codigo} do Ranking GC não entra: a API não publicou ${lista.join(' nem ') || 'nenhuma gerência'}`);
      continue;
    }
    if (faltantes.length) {
      avisos.push(`a linha ${codigo} do Ranking GC soma só ${gerencias.join(' + ')}: a API não publicou ${faltantes.join(', ')}`);
    }
    grupos.push({ codigo, gerencias, faltantes, agrupada: gerencias.length > 1, foraDoMapa: false });
  }
  for (const g of publicadas.filter((x) => !usadas[x]).sort()) {
    avisos.push(`a gerência ${g} não está no agrupamento do Ranking GC (regras v1.6, seção 4): entra como linha própria`);
    grupos.push({ codigo: g, gerencias: [g], faltantes: [], agrupada: false, foraDoMapa: true });
  }
  return { grupos, avisos };
}

/**
 * Estrutura das tabelas de ranking (premissa P7; regras, seção 7) de UMA linha: o que a tela lê sem calcular nada.
 * Dois blocos, Aperitivo (volume) e Skyy (cobertura), e dentro de cada um `porMes[10|11|12]` com
 * { meta, real, online, metaDia, dif, pct, hojeOk, fonte, estado, situacao, aberto, motivo }.
 *   - `online`, `metaDia` e `metaDiaExib` só existem no mês ABERTO (mês de referência fora do período de
 *     fechamento da API); `metaDiaExib` é o valor que a TELA mostra (regras v1.4) e `metaDia` o de origem;
 *     nos outros meses vêm null, e a tela mostra "—" (não é zero, é ausência de medida);
 *   - Aperitivo traz ainda `pctTravado` e `travado` por mês (as colunas Out | Nov | Dez são os % travados) e,
 *     no bloco, `soma` (a pontuação do ranking), `incompleta` e `mesesSemPct`;
 *   - Skyy traz `pctNov`, `pctDez` e `acumulado` (o valor do gatilho; em novembro, parcial), que NÃO mudam com o
 *     seletor de mês; `acumulado` é null nas linhas sem gatilho (consultor).
 *   - `hojeOk` é o "Hoje" colorido do motor (Online > 0 e Online ≥ Meta dia), já resolvido por mês e produto.
 */
function tabelaDaLinha(vol, cob, extra, motor) {
  const comum = (m) => {
    const online = m.aberto ? (m.online === undefined ? null : m.online) : null;
    const metaDia = m.aberto ? (m.metaDia === undefined ? null : m.metaDia) : null;
    // metaDiaExib = o que a TELA mostra (regras v1.4): no volume passa por motor.metaDiaVolume; na cobertura é o
    // próprio valor do motor (já 0 com a meta batida e inteiro para cima). `metaDia` guarda a origem.
    const metaDiaExib = m.aberto ? (m.metaDiaExib === undefined ? null : m.metaDiaExib) : null;
    return { mes: m.mes, anomes: m.anomes, fonte: m.fonte, estado: m.estado || null, situacao: m.situacao,
             aberto: !!m.aberto, meta: m.meta, real: m.real, online, metaDia, metaDiaExib,
             dif: m.dif === undefined ? null : m.dif, pct: m.pct === undefined ? null : m.pct,
             hojeOk: motor.hojeAtingiu(online, metaDiaExib), motivo: m.motivo || null };
  };
  const porMes = (meses, mais) => Object.fromEntries(meses.map((m) => [m.mes, Object.assign(comum(m), mais ? mais(m) : null)]));
  const doMes = (meses, mes) => meses.find((m) => m.mes === mes) || {};
  const g = (extra && extra.gatilho) || null;
  return {
    aperitivo: Object.assign({ porMes: porMes(vol.meses, (m) => ({ pctTravado: m.pctTravado, travado: m.travado })) },
                             { soma: vol.soma, incompleta: vol.incompleta, mesesSemPct: vol.mesesSemPct }),
    skyy: { porMes: porMes(cob), pctNov: doMes(cob, 11).pct === undefined ? null : doMes(cob, 11).pct,
            pctDez: doMes(cob, 12).pct === undefined ? null : doMes(cob, 12).pct,
            acumulado: g ? g.valor : null, parcial: g ? g.parcial : false,
            indisponivel: g ? g.indisponivel : true, motivo: g ? g.motivo : null },
  };
}

/**
 * Monta os dados do ranking a partir do que já foi lido (função pura; carregarRanking faz a leitura):
 *   entrada = { index, gerencias: [gerencias/{GC}.json], resumo: resumo.json, fechados: {AAAAMM: json | Error},
 *               base, ajustes }
 * Devolve, além de mesReferencia/calendario/simulado/avisos:
 *   meses:        [{ mes, anomes, fonte, estado ('aberto' | 'previa' | 'oficial' | null), motivo }] — volume
 *   mesesCobertura: o mesmo para a cobertura de Skyy, que segue outra regra de fonte (fontesDaCobertura)
 *   mesGatilho:   o mês da vigência que está valendo para o gatilho (10, 11, 12 ou null)
 *   gc:           as linhas do RANKING GC, pela gerência comercial agrupada (regras v1.6, seção 4; 12 linhas no
 *                 lugar das 16 gerências da API), já somadas, ordenadas e numeradas; `codigo` é o da LINHA
 *                 ("UR_RI"), e `gerencias` lista as gerências da API que ela soma
 *   gcApi:        uma linha por gerência da API, SEM ranking (sem pos, sem posição oficial e sem status): é o que
 *                 a aba Detalhe do mês e o filtro de gerência usam, que seguem com as 16 (premissa (d) da seção 4)
 *   gc, svMista, svSegmentada: linhas ordenadas e numeradas pelo motor (pos 1..n), cada uma com
 *                 { codigo, chave, gc, canal, origemCanal,
 *                   meses: [volume de Aperitivo, por mês: meta, real, online, metaDia, dif, pct, pctTravado,
 *                           travado, fonte, estado, situacao, aberto], soma, incompleta, mesesSemPct, pos,
 *                   cobertura: [cobertura de Skyy, por mês: meta, real, online, metaDia, dif, pct, fonte,
 *                               estado, situacao, aberto, motivo],
 *                   gatilho: { valor, batido, parcial, indisponivel, motivo }, oficial, status: { status, motivo },
 *                   tabela: { aperitivo, skyy } (estrutura da P7, pronta para a tela) }
 *   fora:         SVs fora do ranking (empate de canal ou sem canal), com o motivo; têm gatilho, mas não têm
 *                 posição oficial nem status (não disputam ranking)
 *   rotas:        consultores, só com os próprios números por mês (sem ranking, sem gatilho e sem status);
 *                 `tipo` é o da API ('normal', 'neutraliza', 'virtual'...) ou null quando a rota só existe num
 *                 mês fechado, que não publica o tipo — a aba Consultor filtra por ele (rotasDaMesa)
 *   totalBand:    linha da empresa (resumo.json -> empresa), com meta dia de volume da API e meta dia de
 *                 cobertura do motor; sem posição oficial e sem status (Diretoria e GP não têm apuração própria)
 *   canaisSV:     canal de cada SV (pelo código do painel, "Sv. An.1"), com origem e votos
 */
function montarDados(entrada, cfg, motor) {
  cfg = cfg || CONFIG; motor = motor || MotorCampariAqui();
  const { index, gerencias } = entrada;
  const base = entrada.base || BaseCanaisAqui();
  const ajustes = entrada.ajustes || { canais: {}, canaisSV: {}, avisos: [] };
  const produtos = localizarProdutos(index, cfg);
  const comum = { mesReferencia: index.mes_referencia || null, calendario: index.calendario || null,
                  atualizadoEm: index.atualizado_em || null, simulado: index.simulado === true, produtos };
  if (!produtos.ok) {
    return Object.assign({ ok: false, erro: 'Produtos do Campari ainda não publicados (' + produtos.motivos.join('; ') + ')',
                           avisos: [], meses: [], mesesCobertura: [], mesGatilho: null, gc: [], gcApi: [], svMista: [],
                           svSegmentada: [], fora: [], rotas: [], totalBand: null, canaisSV: {} }, comum);
  }
  const pid = produtos.ids.aperitivo, pidSkyy = produtos.ids.skyy;
  const avisos = ajustes.avisos.slice();
  // Total Band: só do resumo.json -> empresa.produtos (nunca soma de gerências). Sem o arquivo, o nível fica
  // indisponível no mês de referência, com aviso.
  const empresaApi = ehObjeto(entrada.resumo) && ehObjeto(entrada.resumo.empresa) && ehObjeto(entrada.resumo.empresa.produtos)
    ? entrada.resumo.empresa.produtos : null;
  if (!empresaApi) avisos.push('resumo.json indisponível ou em formato inesperado: o Total Band do mês de referência fica sem números');

  // 1. fonte de cada mês (P1) e leitura dos fechados
  const fontes = fontesDosMeses(index, cfg).map((f) => Object.assign({}, f));
  const lidos = {};
  for (const f of fontes) {
    if (f.fonte === 'api') f.estado = 'aberto';
    if (f.fonte !== 'fechado') continue;
    const bruto = (entrada.fechados || {})[f.anomes];
    const l = bruto instanceof Error ? { ok: false, motivo: bruto.message } : bruto === undefined ? { ok: false, motivo: 'não carregado' } : lerFechado(bruto, f.anomes, pid);
    if (!l.ok) { Object.assign(f, { fonte: 'indisponivel', motivo: `${f.arquivo}: ${l.motivo}` }); continue; }
    f.estado = l.estado;
    if (l.motivo) f.motivo = `${f.arquivo}: ${l.motivo} (GC indisponível neste mês)`;
    if (l.simulado !== comum.simulado) avisos.push(`${f.arquivo} ${l.simulado ? 'é' : 'não é'} simulado, e o index.json ${comum.simulado ? 'é' : 'não é'}`);
    lidos[f.anomes] = l;
  }
  for (const f of fontes) if (f.fonte === 'indisponivel') avisos.push(`${NOMES_MES[f.mes]} indisponível: ${f.motivo}; a soma das linhas fica incompleta`);
  for (const f of fontes) if (f.fonte === 'fechado' && f.motivo) avisos.push(f.motivo);

  // 2. valores por nível e mês (anomes -> código -> valores); o que a API publica, sem recalcular.
  // O nível `grupo` é o do Ranking GC agrupado (passo 2c): ele não vem da API, é a soma das gerências do grupo.
  const vals = { gc: {}, grupo: {}, sv: {}, rota: {}, empresa: {} }, info = { gc: {}, sv: {}, rota: {} };
  const por = (nivel, anomes, cod, v) => { ((vals[nivel][cod] = vals[nivel][cod] || {}))[anomes] = v; };
  const anotar = (nivel, cod, dados) => { info[nivel][cod] = Object.assign(info[nivel][cod] || {}, dados); };
  // estrutura atual (API): todas as gerências, supervisões e rotas aparecem, mesmo sem número em algum mês
  for (const g of gerencias) {
    const gid = g.gerencia.id;
    anotar('gc', gid, {});
    for (const s of g.supervisoes || []) anotar('sv', s.id, { gc: gid });
    for (const r of g.rotas || []) if (r.tipo !== 'eventual' && !ehEventual(r.id)) anotar('rota', r.id, { gc: gid, sv: r.supervisao, tipo: r.tipo || null });
  }
  for (const f of fontes) {
    if (f.fonte === 'api') {
      for (const g of gerencias) {
        por('gc', f.anomes, g.gerencia.id, doBlocoApi((g.produtos || {})[pid]));
        for (const s of g.supervisoes || []) por('sv', f.anomes, s.id, doBlocoApi((s.produtos || {})[pid]));
        for (const r of g.rotas || []) if (r.tipo !== 'eventual' && !ehEventual(r.id)) por('rota', f.anomes, r.id, doBlocoApi((r.produtos || {})[pid]));
      }
      if (empresaApi) por('empresa', f.anomes, TOTAL_BAND, doBlocoApi(empresaApi[pid]));
    } else if (f.fonte === 'fechado') {
      const l = lidos[f.anomes];
      if (l.empresa) por('empresa', f.anomes, TOTAL_BAND, l.empresa);
      if (l.gc) for (const [g, v] of Object.entries(l.gc)) { anotar('gc', g, {}); por('gc', f.anomes, g, v); }
      for (const [s, v] of Object.entries(l.sv)) { if (!info.sv[s]) anotar('sv', s, { gc: null }); por('sv', f.anomes, s, v); }
      for (const r of l.rotas) {
        if (!info.rota[r.rota]) anotar('rota', r.rota, { gc: r.gc, sv: r.sv });
        por('rota', f.anomes, r.rota, r.valores);
      }
    }
  }
  // gerência do SV que só existe num fechado: a das rotas dele naquele mês
  for (const f of fontes) if (lidos[f.anomes]) for (const [s, g] of Object.entries(lidos[f.anomes].gcDoSv)) if (info.sv[s] && !info.sv[s].gc) info.sv[s].gc = g;
