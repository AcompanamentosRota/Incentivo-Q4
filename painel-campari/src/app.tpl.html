<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campari Club 2026 · Painel de acompanhamento</title>
<style>
/*__FONTS__*/
/* Etapa 4: a tela do mockup aprovado em 08/11/2026. Nenhuma regra de cálculo aqui: tudo vem do motor e do
   adaptador. Nenhum número de regra digitado (gatilho, trava e posições premiadas saem de R = motor.REGRAS).
   Nenhuma fonte de site externo: Barlow Condensed 800 é embutida pelo build e o resto é Inter, com reserva na
   fonte do sistema.
   Etapa 4B (regras v1.6, seções 5 e 7; decisão de 09/11/2026): nas duas tabelas de ranking o Status mostra só o
   selo (o motor continua devolvendo o motivo, a tela não escreve mais), as legendas e o aviso de SVs fora do
   ranking saem da tela (o aviso continua em Regras > Dados e alertas), os blocos ganham cor (Aperitivo laranja,
   Skyy azul, no padrão do Desafio Q4: título escuro e células em tom bem claro), a Dif. negativa fica vermelha
   e o % de cobertura ganha o quadradinho verde/vermelho — a cor vem de motor.corDoPercentual, nunca daqui. */
:root{
  --red:#E4002B; --gold:#FFC84A; --turq:#2EC4B6; --turq2:#7FE7DC; --laranja:#FFB86B;
  /* Etapa 4B — valores copiados do Desafio Q4 (painel-q4/src/app.tpl.html), que o Campari não importa:
     --negv  = o vermelho da diferença negativa do Q4 (#ffb3bd);
     --sk-*  = bloco Skyy (azul): título no --blued do Q4 (#0a2a6e) e células no .pchip.t5 (rgba(29,123,255,.30),
               um pouco mais apagado porque aqui cobre um bloco inteiro, não um número);
     --pct-* = o quadradinho do % (.pchip do Q4): verde do --green/.pill.tot, vermelho do .pchip.t2.
     Etapa 4C — o bloco Aperitivo deixa de ser o amarelo escuro do Q4 e passa ao LARANJA do print do SAC
     (pedido da Karen em 09/11/2026, que viu a 4B num marrom-amarelado):
     --ap-tit = laranja médio do SAC (#E07B41) no título do bloco e nos cabeçalhos das colunas do Aperitivo;
     --ap-tit-fg = o texto deles. É ESCURO porque branco sobre #E07B41 dá contraste 2,97:1 (abaixo de 4,5:1) e
               o marrom bem escuro dá 5,3:1 — a decisão está registrada no PR da etapa 4C;
     --ap-cel = corpo das células, num laranja queimado (#E07B41 a 58% sobre o painel): os números seguem
               brancos, com 6,3:1. Tinta clara sobre o azul-marinho do painel vira marrom, então "laranja claro"
               com o tema escuro só sai assim (escolha da Karen em 09/11/2026). */
  --negv:#FFB3BD;
  --ap-tit:#E07B41; --ap-tit-fg:#2B1703; --ap-cel:rgba(224,123,65,.58);
  --sk-tit:#0A2A6E; --sk-cel:rgba(29,123,255,.20);
  --pct-ok-bg:rgba(34,177,76,.28); --pct-ok-fg:#C4FFD3;
  --pct-no-bg:rgba(194,40,64,.28); --pct-no-fg:#FFC2CC;
  --panel:rgba(9,26,52,.93); --line:rgba(255,255,255,.12); --muted:#B9BCC4; --cinza:#9AA1AE; --ink:#FFFFFF;
  --chrome:rgba(6,22,44,.88);
  --ff:Inter,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',var(--ff);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#06162C;color:var(--ink);overflow:hidden;font-family:var(--ff);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

/* palco: 1920 de largura e a altura da janela (mesmo fit() do Desafio Q4, copiado, não importado) */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(var(--s,1));overflow:hidden}
/* o fundo entra aqui pelo build (premissa P2): a imagem quando existir, senão só o azul sólido */
.bg{position:absolute;inset:0;/*__FUNDO__*/}
/* véu escuro só no rodapé: garante contraste do texto cinza sobre a parte clara da arte (pôr do sol / mar),
   sem cobrir o logo, o letreiro e a faixa de meses, que ficam no alto */
.bg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(6,22,44,0),rgba(6,22,44,.92))}
/* A faixa de cima (até ~148px) é da arte do fundo: logo, letreiro e meses. Nada é desenhado por cima dela. */

.info{position:absolute;right:60px;top:12px;text-align:right;line-height:1.1;display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:baseline;justify-items:end}
.info small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.info b{font-size:24px;font-weight:600;margin-bottom:3px}
.info .sim{grid-column:1/-1;margin-top:2px;padding:2px 10px;border-radius:6px;background:var(--gold);color:#2A1D00;font-size:13px;font-weight:700;letter-spacing:.06em}

.nav{position:absolute;left:60px;right:60px;top:148px;height:40px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.seg{display:flex;background:var(--chrome);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{display:inline-flex;align-items:center;padding:4px 16px;min-height:32px;border-radius:999px;font-size:16px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--red);color:#fff;box-shadow:0 0 18px rgba(228,0,43,.5)}
.seg button:not([aria-selected="true"]):hover{color:#fff}
.filtros{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:600;color:var(--muted);background:var(--chrome);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 16px}
.filtros label{display:flex;align-items:center;gap:8px}
.sel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.28);border-radius:9px;height:34px;padding:0 8px;font-size:16px;color:#fff;min-width:130px}
.sel option{background:#06162C;color:#fff}
.sel:disabled{opacity:.5}
.canais{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:2px}
.canais button{display:inline-flex;align-items:center;padding:4px 16px;min-height:32px;border-radius:999px;font-size:16px;font-weight:700;color:var(--muted)}
.canais button[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 0 14px rgba(228,0,43,.5)}

.faixa{position:absolute;left:60px;right:60px;top:196px;display:none;padding:8px 18px;border-radius:12px;font-size:17px;font-weight:600;border:1px solid}
.faixa.on{display:block}
.faixa.err{background:#4A0D17;border-color:#E8304A;color:#FFD0D8}
.faixa.warn{background:#3A2A00;border-color:#A47500;color:#FFE29A}
#stage.comfaixa .view{top:244px}

.view{position:absolute;left:60px;right:60px;top:198px;bottom:48px;display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.panel{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 22px;display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:none}
.ph h2{margin:0;font-family:var(--cond);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase}
.ph .nota{font-size:15px;color:var(--muted);text-align:right}
.rolar{flex:1;min-height:0;overflow:auto;overflow-x:hidden}
.aviso{display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:14px;background:rgba(46,196,182,.14);border:1px solid rgba(46,196,182,.4);font-size:16px;color:#D9FBF7;flex:none}

/* tabelas */
.tb{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tb th{font-size:13px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:var(--muted);text-align:right;padding:5px 5px;border-bottom:1px solid rgba(255,255,255,.18);white-space:nowrap;background:#0B1E3C;position:sticky;z-index:2}
.tb tr.grp th{top:0;border-bottom:none;text-align:center;font-family:var(--cond);font-weight:800;font-size:18px;letter-spacing:.04em;color:#fff;padding-bottom:0}
/* Etapa 4B: cor dos dois blocos (Ranking GC e Supervisão). O título leva o tom ESCURO e o corpo das células o tom
   BEM CLARO da mesma cor, pelo <colgroup> — assim nenhuma célula precisa de classe e o fundo claro fica embaixo
   do .k, do hover e da linha de total, que são todos semitransparentes. */
.tb tr.grp th.bl-ap{background:var(--ap-tit)}
.tb tr.grp th.bl-sk{background:var(--sk-tit)}
.tb colgroup.cg-ap{background:var(--ap-cel)}
.tb colgroup.cg-sk{background:var(--sk-cel)}
.tb tr.grp th small{font-family:var(--ff);font-size:13px;font-weight:600;color:var(--turq2);letter-spacing:.04em}
/* Etapa 4C: o laranja do Aperitivo vai também aos cabeçalhos das COLUNAS do bloco, e o texto deles é escuro
   (ver o cálculo de contraste na lista de variáveis). O bloco Skyy fica como estava. */
.tb tr.hdr th.hd-ap{background:var(--ap-tit)}
.tb tr.grp th.bl-ap,.tb tr.grp th.bl-ap small,.tb tr.hdr th.hd-ap{color:var(--ap-tit-fg)}
.tb tr.hdr th{top:25px}
.tb th.l,.tb td.l{text-align:left}
.tb td{padding:5px 5px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right;white-space:nowrap;color:#fff}
.tb td.sep,.tb th.sep{border-left:1px solid rgba(255,255,255,.16)}
.tb.g2 th.l:first-child,.tb.g2 td.l:first-child{width:200px}
.tb th.k,.tb td.k{background:rgba(255,255,255,.05)}
.tb tr.tot td{font-weight:700;border-top:2px solid var(--red);border-bottom:none;background:rgba(228,0,43,.07)}
.tb tr:hover td:not(.k){background:rgba(255,255,255,.03)}
/* As duas tabelas de ranking: fonte 1 px menor do que as de Consultor e Detalhe (nada abaixo de 13 px) e linhas
   mais justas (3 px em vez de 5 px em cima e embaixo). É o que faz as 16 gerências e o Total Band caberem sem
   rolagem no Ranking GC com a janela maximizada (~1920x940): com 5 px sobravam 62 px de rolagem. */
.tb.rk{font-size:14px}
.tb.rk td,.tb.rk th{padding-top:3px;padding-bottom:3px}
.tb.rk tr.grp th{font-size:17px}
.tb.rk .n{font-size:19px}
.tb.rk .n.g{font-size:23px}
.tb.rk .cod{font-size:15px}
.cod{font-weight:700;font-size:16px}
.n{font-family:var(--cond);font-weight:800;font-size:20px;line-height:1}
.n.g{font-size:24px}
/* Diferença negativa: vermelha (regras v1.6, seção 7; substitui o laranja). O seletor precisa do `td` para
   ganhar de `.tb td{color:#fff}`: só com `.neg` a cor não chegava à célula (era o caso do laranja da etapa 4). */
.tb td.neg{color:var(--negv)}
/* quadradinho do % de cobertura, como o quadro do % do Desafio Q4; a cor vem de motor.corDoPercentual */
.pchip{display:inline-block;border-radius:5px;padding:0 6px}
.pchip.verde{background:var(--pct-ok-bg);color:var(--pct-ok-fg)}
.pchip.vermelho{background:var(--pct-no-bg);color:var(--pct-no-fg)}
.hoje{display:inline-block;padding:1px 8px;border-radius:7px}
.hoje.ok{background:rgba(46,196,182,.22);color:var(--turq2);font-weight:700}
.tv{display:inline-block;margin-left:3px;font-size:13px;font-weight:700;color:var(--laranja)}
.pos{color:#fff}.pos.cinza{color:var(--cinza)}
.of{color:var(--gold)}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--turq);color:#032B28}
.pill.no{background:rgba(255,255,255,.08);color:var(--muted)}

/* regras: três colunas */
.rg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.rg section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-height:0}
.rg h2{margin:0;font-family:var(--cond);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase}
.rg .item{display:flex;gap:13px}
.rg .ic{flex:none;width:42px;height:42px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:800;font-size:22px}
.rg .item div{font-size:16px;line-height:1.4}
.rg .exemplo{margin-top:auto;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:15px;line-height:1.4;color:#D7DBE3}
.rg .exemplo b{color:var(--gold)}
.rg .st{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px}
.rg .st.a{background:rgba(46,196,182,.12);border:1px solid rgba(46,196,182,.45)}
.rg .st.b{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}
.rg .st .pill{min-width:92px;text-align:center;padding:5px 14px;font-size:16px}
.rg .st div{font-size:16px;line-height:1.4}
.rg p{font-size:15px;line-height:1.5;color:#D7DBE3}
.rg .md{width:100%;border-collapse:collapse;font-size:15px}
.rg .md td{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top;line-height:1.4}
.rg .md td:first-child{width:112px;font-weight:700;color:var(--turq2)}
.al{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.al div{padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.4}
.al .erro{background:rgba(232,48,74,.16);border:1px solid #E8304A;color:#FFD0D8}
.al .aviso2{background:rgba(255,184,107,.14);border:1px solid rgba(255,184,107,.5);color:#FFE3C2}
.al .nota{background:rgba(255,255,255,.06);color:#D7DBE3}
.al b{display:block}

.foot{position:absolute;left:60px;right:60px;bottom:10px;font-size:14px;font-weight:500;line-height:1.25;color:var(--muted);display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.foot #rod{flex:none;text-align:right}
.vazio{margin:auto;text-align:center;font-size:20px;color:var(--muted);padding:40px}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div class="info" id="info"></div>

  <nav class="nav" aria-label="Abas do painel">
    <div class="seg" role="tablist" id="abas"></div>
    <div id="filtros"></div>
  </nav>

  <div class="faixa" id="faixa" role="alert"></div>

  <section class="view" id="v-gc" aria-label="Ranking das gerências"></section>
  <section class="view" id="v-sv" aria-label="Ranking das supervisões"></section>
  <section class="view" id="v-rt" aria-label="Consultor"></section>
  <section class="view" id="v-det" aria-label="Detalhe do mês"></section>
  <section class="view" id="v-regras" aria-label="Regras do incentivo"><div class="rg" id="rgbd"></div></section>

  <div class="foot"><span id="rodesq"></span><span id="rod"></span></div>
</div>

<script>/*__MOTOR__*/</script>
<script>const BASE_CANAIS_CAMPARI = /*__BASE__*/;</script>
<script>/*__ADAPTER__*/</script>
<script>
(async function(){
'use strict';
const M = window.MotorCampari;
const R = M.REGRAS;  /* premissa P6: gatilho, trava e posições premiadas só daqui, nunca digitados na tela */
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s===null||s===undefined?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* palco ajustado à janela (mesmo fit() do Desafio Q4) */
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/720), sg=$('stage'); sg.style.setProperty('--s', s); sg.style.width=(innerWidth/s)+'px'; sg.style.height=(innerHeight/s)+'px'; }
fit(); addEventListener('resize', fit);

const ABAS = [
  { id:'gc', nome:'Ranking GC' }, { id:'sv', nome:'Supervisão' }, { id:'rt', nome:'Consultor' },
  { id:'det', nome:'Detalhe do mês' }, { id:'regras', nome:'Regras' },
];
const NIVEL = { gc:'gc', Mista:'svMista', Segmentada:'svSegmentada' };
/* rótulo de cada nível de ranking (texto, não regra); o limite vem de R.premiadas */
const NOME_NIVEL = { gc:'GC', svMista:'SV Mista', svSegmentada:'SV Segmentada' };

const D = await carregarRanking(CONFIG.api);
const SEL = mesesDoSeletor(D);
const FIL = filtrosDoPainel(D);
const mesAbertoObj = SEL.meses.find((m)=>m.aberto) || null;
const mesAberto = mesAbertoObj ? mesAbertoObj.mes : null;
const mostrarPctNov = mesAberto === 12;   /* "% Nov" só quando o mês aberto for dezembro (premissa P4) */
const st = { aba:'gc', mes:SEL.padrao, canal:'Mista', ger:'', sv:(FIL.svs[0]||{}).codigo||'', detVisao:'gc', detMes:SEL.padrao };

/* ─── faixa de topo: API fora, dados simulados ou produtos não publicados ─────────────────────────────── */
const fx = $('faixa');
if(!D.ok){ fx.className='faixa on err'; fx.textContent='API indisponível ('+D.erro+'): sem dados. Nada é calculado.'; }
else if(D.simulado){ fx.className='faixa on err'; fx.textContent='ATENÇÃO: a API está com DADOS SIMULADOS (fictícios). Não use estes números.'; }
else if(D.produtos && !D.produtos.ok){ fx.className='faixa on warn'; fx.textContent='Produtos do Campari ainda não publicados ('+D.produtos.motivos.join('; ')+'). Nada é calculado.'; }
$('stage').classList.toggle('comfaixa', fx.classList.contains('on'));

/* ─── cabeçalho e rodapé ──────────────────────────────────────────────────────────────────────────────── */
const diaUtil = rotuloDiaUtil(D.calendario);
$('info').innerHTML = '<small>Dados de</small><b>'+esc(fmtDataHora(D.atualizadoEm))+'</b>'+
  '<small>Mês</small><b>'+esc((D.mesReferencia&&D.mesReferencia.rotulo)||TRACO)+(diaUtil?' · '+esc(diaUtil):'')+'</b>'+
  (D.simulado?'<span class="sim">DADOS FICTÍCIOS</span>':'');
const listar = (ns)=>{ const v=ns.map((m)=>NOMES_MES[m]); return v.length<2?v.join(''):v.slice(0,-1).join(', ')+' e '+v[v.length-1]; };
const mesesComTrava = listar(Object.keys(R.trava).filter((m)=>R.trava[m]!==null).map(Number));
const mesesDoGatilho = listar(R.gatilho.meses);
const limites = Object.keys(R.premiadas).map((k)=>NOME_NIVEL[k]+': '+R.premiadas[k]).join(' · ');
$('rodesq').innerHTML = 'Real: vendido até ontem · Online: venda de hoje · "Hoje" em turquesa: atingiu a meta dia · '+
  'posição em cinza: gatilho pendente · desempate pela ordem alfabética do código';
$('rod').innerHTML = 'Regras v'+esc(M.versaoRegras)+' · fonte: API (./api/v1/)';

/* ─── pedaços de célula ───────────────────────────────────────────────────────────────────────────────── */
const vol = (v)=>esc(fmtVolume(v));
const cob = (v)=>esc(fmtCobertura(v));
const pct = (v)=>esc(fmtPct(v));
/* Diferença: vermelha quando negativa (regras v1.6, seção 7; o sinal vem do número, a cor é só leitura) */
const difCel = (v, f)=>'<td class="'+(typeof v==='number'&&v<0?'neg':'')+'">'+esc(f(v))+'</td>';
/* "Hoje": destacado só quando motor.hojeAtingiu disse que atingiu (m.hojeOk) */
const hojeCel = (m, f)=>'<td><span class="hoje'+(m.hojeOk?' ok':'')+'">'+esc(m.aberto?f(m.online):TRACO)+'</span></td>';
/* M. Dia: só existe no mês aberto; o valor é o de EXIBIÇÃO (metaDiaExib, regras v1.4) */
const mdiaCel = (m, f)=>'<td>'+esc(m.aberto?f(m.metaDiaExib):TRACO)+'</td>';
/* Out | Nov | Dez: o % travado; travado mostra entre parênteses o % real do mês, antes da trava */
const mesCel = (m)=>{
  if(!m || m.pctTravado===null||m.pctTravado===undefined) return '<td><span class="n">'+esc(TRACO)+'</span></td>';
  return '<td><span class="n">'+pct(m.pctTravado)+'</span>'+(m.travado?'<span class="tv">'+pct(m.pct)+'</span>':'')+'</td>';
};
/* % de cobertura de Skyy ("% do mês" e "% Acumulado"): o quadradinho verde/vermelho. A tela NÃO compara nada com
   o mínimo do gatilho: pergunta a cor ao motor, que decide pelo valor BRUTO (99,99999% mostra 99,9% e fica
   vermelho). Sem valor: sem quadradinho. */
const pctCobCel = (v, extra)=>{
  const cor = M.corDoPercentual(v);
  return '<td'+(extra||'')+'><span class="n'+(cor?' pchip '+cor:'')+'">'+pct(v)+'</span></td>';
};
/* Status: só o selo (regras v1.6, seção 5; decisão de 09/11/2026). O motor continua devolvendo o motivo
   (l.status.motivo) e nada na tela o escreve. */
const statusCel = (l)=>{
  const ok = !!l.status && l.status.status==='Bateu!';
  return '<td class="l sep"><span class="pill '+(ok?'ok':'no')+'">'+(ok?'✓ ':'')+esc(l.status?l.status.status:TRACO)+'</span></td>';
};

/* ─── tabela de ranking (Ranking GC e Supervisão; colunas da premissa P5 / regras v1.4, seção 7) ──────── */
function cabecalhoRanking(rotuloId){
  const apCols = 9, skCols = mostrarPctNov?8:7;
  return '<colgroup><col span="3"></colgroup>'+
    '<colgroup class="cg-ap"><col span="'+apCols+'"></colgroup>'+
    '<colgroup class="cg-sk"><col span="'+skCols+'"></colgroup>'+
    '<colgroup><col></colgroup>'+
    '<thead>'+
    '<tr class="grp"><th colspan="3"></th>'+
    '<th colspan="'+apCols+'" class="sep bl-ap">VOLUME DE APERITIVO <small>· RANKING</small></th>'+
    '<th colspan="'+skCols+'" class="sep bl-sk">COBERTURA DE SKYY <small>· GATILHO ≥ '+pct(R.gatilho.minimo)+'</small></th>'+
    '<th class="sep"></th></tr>'+
    '<tr class="hdr"><th class="l">Pos.</th><th class="l">Of.</th><th class="l">'+esc(rotuloId)+'</th>'+
    '<th class="hd-ap sep">Meta</th><th class="hd-ap">Real</th><th class="hd-ap">M. Dia</th>'+
    '<th class="hd-ap">Online</th><th class="hd-ap">Dif.</th>'+
    R.meses.map((m)=>'<th class="hd-ap">'+esc(NOMES_MES[m].slice(0,3))+'</th>').join('')+'<th class="hd-ap k">Soma</th>'+
    '<th class="sep">Meta</th><th>Real</th><th>M. Dia</th><th>Online</th><th>Dif.</th><th>% mês</th>'+
    (mostrarPctNov?'<th>% '+esc(NOMES_MES[11].slice(0,3))+'</th>':'')+'<th class="k">% Acum.</th>'+
    '<th class="l sep">Status</th></tr></thead>';
}
function linhaRanking(l, opc){
  opc = opc || {};
  const ap = valoresDoMes(l.tabela,'aperitivo',st.mes), sk = valoresDoMes(l.tabela,'skyy',st.mes);
  const bAp = l.tabela.aperitivo, bSk = l.tabela.skyy;
  const idCels = opc.total
    ? '<td class="l" colspan="3">'+esc(l.codigo)+' <span style="font-weight:500;font-size:13px;color:var(--muted)">· Diretoria e GP</span></td>'
    : '<td class="l"><span class="n pos'+(l.oficial?'':' cinza')+'">'+esc(l.pos)+'º</span></td>'+
      '<td class="l"><span class="n of">'+(l.oficial?esc(l.oficial)+'º':esc(TRACO))+'</span></td>'+
      '<td class="l cod">'+esc(l.codigo)+'</td>';
  return '<tr'+(opc.total?' class="tot"':'')+'>'+idCels+
    '<td class="sep">'+vol(ap.meta)+'</td><td>'+vol(ap.real)+'</td>'+mdiaCel(ap, fmtVolume)+hojeCel(ap, fmtVolume)+difCel(ap.dif, fmtVolume)+
    R.meses.map((m)=>mesCel(valoresDoMes(l.tabela,'aperitivo',m))).join('')+
    '<td class="k"><span class="n g">'+(opc.total?esc(TRACO):pct(bAp.soma))+'</span></td>'+
    '<td class="sep">'+cob(sk.meta)+'</td><td>'+cob(sk.real)+'</td>'+mdiaCel(sk, fmtCobertura)+hojeCel(sk, fmtCobertura)+difCel(sk.dif, fmtCobertura)+
    pctCobCel(sk.pct)+
    (mostrarPctNov?'<td><span class="n">'+pct(bSk.pctNov)+'</span></td>':'')+
    pctCobCel(bSk.acumulado, ' class="k"')+
    (opc.total?'<td class="l sep" style="font-weight:500;font-size:13px;color:var(--muted)">sem ranking</td>':statusCel(l))+
    '</tr>';
}
/* Sem legenda nas duas tabelas de ranking (regras v1.6, seção 7; decisão de 09/11/2026): o selo, a trava, a Soma
   e o % Acum. ficam explicados na aba Regras, e o rodapé comum continua. */
function tabelaRanking(linhas, rotuloId, comTotal){
  const corpo = linhas.map((l)=>linhaRanking(l)).join('') +
    (comTotal && D.totalBand ? linhaRanking(D.totalBand, { total:true }) : '');
  return '<div class="rolar"><table class="tb rk">'+cabecalhoRanking(rotuloId)+'<tbody>'+corpo+'</tbody></table></div>';
}

/* ─── tabela de dois grupos (Consultor e Detalhe do mês) ──────────────────────────────────────────────── */
function tabelaGrupos(linhas, rotuloId, mes, totalLinha, rotuloTotal){
  const cabeca = '<thead><tr class="grp"><th class="l"></th>'+
    '<th colspan="6" class="sep">VOLUME DE APERITIVO</th>'+
    '<th colspan="6" class="sep">COBERTURA DE SKYY <small>· CLIENTES</small></th></tr>'+
    '<tr class="hdr"><th class="l">'+esc(rotuloId)+'</th>'+
    ['sep','','','','',''].map((c,i)=>'<th'+(i===0?' class="sep"':'')+'>'+['Meta','Real','Meta dia','Hoje','Dif.','%'][i]+'</th>').join('')+
    ['sep','','','','',''].map((c,i)=>'<th'+(i===0?' class="sep"':'')+'>'+['Meta','Real','Meta dia','Hoje','Dif.','%'][i]+'</th>').join('')+
    '</tr></thead>';
  const corpo = (l, total)=>{
    const ap = valoresDoMes(l.tabela,'aperitivo',mes), sk = valoresDoMes(l.tabela,'skyy',mes);
    return '<tr'+(total?' class="tot"':'')+'><td class="l cod">'+esc(total?rotuloTotal:l.codigo)+'</td>'+
      '<td class="sep">'+vol(ap.meta)+'</td><td>'+vol(ap.real)+'</td>'+mdiaCel(ap, fmtVolume)+hojeCel(ap, fmtVolume)+difCel(ap.dif, fmtVolume)+'<td style="font-weight:700">'+pct(ap.pct)+'</td>'+
      '<td class="sep">'+cob(sk.meta)+'</td><td>'+cob(sk.real)+'</td>'+mdiaCel(sk, fmtCobertura)+hojeCel(sk, fmtCobertura)+difCel(sk.dif, fmtCobertura)+'<td style="font-weight:700">'+pct(sk.pct)+'</td>'+
      '</tr>';
  };
  return '<div class="rolar"><table class="tb g2">'+cabeca+'<tbody>'+linhas.map((l)=>corpo(l,false)).join('')+
    (totalLinha?corpo(totalLinha,true):'')+'</tbody></table></div>';
}

/* ─── filtros da linha das abas ───────────────────────────────────────────────────────────────────────── */
function seletorMes(id, valor){
  return '<label for="'+id+'">Mês de referência <select id="'+id+'" class="sel">'+
    SEL.meses.map((m)=>'<option value="'+m.mes+'"'+(m.mes===valor?' selected':'')+(m.habilitado?'':' disabled')+'>'+esc(m.rotulo)+'</option>').join('')+
    '</select></label>';
}
function seletorGer(id, valor, comTodas){
  return '<label for="'+id+'">Gerência <select id="'+id+'" class="sel">'+(comTodas?'<option value="">Todas</option>':'')+
    FIL.gerencias.map((g)=>'<option value="'+esc(g)+'"'+(g===valor?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select></label>';
}
function renderFiltros(){
  const f = $('filtros');
  if(st.aba==='gc'){ f.className='filtros'; f.innerHTML = seletorMes('f-mes', st.mes); }
  else if(st.aba==='sv'){
    f.className='filtros';
    f.innerHTML = '<span id="lbl-canal">Canal</span><div class="canais" role="group" aria-labelledby="lbl-canal">'+
      ['Mista','Segmentada'].map((c)=>'<button type="button" data-canal="'+c+'" aria-pressed="'+(st.canal===c)+'">'+c+'</button>').join('')+
      '</div>'+seletorGer('f-ger', st.ger, true)+seletorMes('f-mes', st.mes);
  }
  else if(st.aba==='rt'){
    f.className='filtros';
    const svs = FIL.svs.filter((s)=>!st.ger || s.gc===st.ger);
    if(svs.length && !svs.some((s)=>s.codigo===st.sv)) st.sv = svs[0].codigo;
    f.innerHTML = seletorGer('f-ger', st.ger, true)+
      '<label for="f-sv">Supervisão <select id="f-sv" class="sel" style="min-width:190px">'+
      svs.map((s)=>'<option value="'+esc(s.codigo)+'"'+(s.codigo===st.sv?' selected':'')+'>'+esc(s.rotulo)+'</option>').join('')+
      '</select></label>'+seletorMes('f-mes', st.mes);
  }
  else if(st.aba==='det'){
    f.className='filtros';
    f.innerHTML = '<label for="f-vis">Visão <select id="f-vis" class="sel"><option value="gc"'+(st.detVisao==='gc'?' selected':'')+'>Gerência</option>'+
      '<option value="sv"'+(st.detVisao==='sv'?' selected':'')+'>Supervisão</option></select></label>'+
      (st.detVisao==='sv'?seletorGer('f-ger', st.ger, true):'')+seletorMes('f-mesdet', st.detMes);
  }
  else { f.className=''; f.innerHTML=''; }
}

/* ─── abas ────────────────────────────────────────────────────────────────────────────────────────────── */
const semDados = ()=>'<div class="panel"><div class="vazio">'+(D.ok?'Sem dados para mostrar.':'API indisponível: nada é calculado.')+'</div></div>';
const rotuloMesSel = (mes)=>{ const m = SEL.meses.find((x)=>x.mes===mes); return m?m.rotulo:TRACO; };

function viewGC(){
  if(!D.ok || !D.gc.length) return semDados();
  const comGatilho = D.gc.filter((l)=>l.gatilho&&l.gatilho.batido).length;
  /* Etapa 4C: as linhas são as da gerência comercial AGRUPADA (D.gc), somadas pelo adaptador e pelo motor; a
     coluna Gerência mostra o código da própria linha. O Detalhe do mês e os filtros seguem com as da API. */
  return '<div class="panel"><div class="ph"><h2>Ranking das gerências comerciais</h2>'+
    '<div class="nota">'+D.gc.length+' linhas (gerência comercial agrupada) · '+comGatilho+' com gatilho batido · ordem pela Soma de Aperitivo<br>'+
    'Meta, Real, Dif. e % do mês: '+esc(rotuloMesSel(st.mes))+'</div></div>'+
    tabelaRanking(D.gc,'Gerência',true)+'</div>';
}
function viewSV(){
  if(!D.ok) return semDados();
  const todas = D[NIVEL[st.canal]] || [];
  const linhas = st.ger ? todas.filter((l)=>l.gc===st.ger) : todas;
  const comGatilho = linhas.filter((l)=>l.gatilho&&l.gatilho.batido).length;
  /* As supervisões sem canal (ou com empate de canal na mesa) não aparecem mais nesta tela, nem a legenda
     (regras v1.6, seção 7): o aviso continua calculado no adaptador (D.fora) e sai em Regras > Dados e alertas. */
  return '<div class="panel"><div class="ph"><h2>Supervisão '+esc(st.canal)+'</h2>'+
    '<div class="nota">'+linhas.length+' supervisores · '+comGatilho+' com gatilho batido · ordem pela Soma de Aperitivo<br>'+
    'Meta, Real, Dif. e % do mês: '+esc(rotuloMesSel(st.mes))+'</div></div>'+
    (linhas.length?tabelaRanking(linhas,'Supervisão',false):'<div class="vazio">Nenhuma supervisão '+esc(st.canal)+' neste filtro.</div>')+
    '</div>';
}
function viewRT(){
  if(!D.ok) return semDados();
  const mesa = rotasDaMesa(D, st.sv);
  const ocultas = textoDasOcultas(mesa.ocultas);
  return '<div class="panel"><div class="ph"><h2>Rotas da mesa '+esc(st.sv||TRACO)+' · '+esc(rotuloMesSel(st.mes))+'</h2>'+
    '<div class="nota">'+mesa.rotas.length+' rotas'+(ocultas?' · '+esc(ocultas):'')+'</div></div>'+
    '<div class="aviso"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FE7DC" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>'+
    '<span>Consultor é acompanhamento: ranking e premiação são do supervisor para cima. O "Total da mesa" é o número que a API publica para a supervisão, somando <b>todas</b> as rotas da mesa'+(ocultas?' — inclusive as que não aparecem na lista':'')+'.</span></div>'+
    (mesa.rotas.length?tabelaGrupos(mesa.rotas,'Rota',st.mes,mesa.total,'Total da mesa '+st.sv)
      :'<div class="vazio">Nenhuma rota do tipo normal nesta mesa.</div>')+
    '</div>';
}
function viewDet(){
  if(!D.ok) return semDados();
  const linhas = linhasDoDetalhe(D, st.detVisao, st.ger);
  const rot = st.detVisao==='sv'?'Supervisão':'Gerência';
  return '<div class="panel"><div class="ph"><h2>'+esc(rotuloMesSel(st.detMes))+' por '+esc(rot.toLowerCase())+'</h2>'+
    '<div class="nota">'+linhas.length+' linhas · "Hoje" em turquesa: atingiu a meta dia · diferença negativa em vermelho</div></div>'+
    (linhas.length?tabelaGrupos(linhas,rot,st.detMes,st.detVisao==='gc'?D.totalBand:null,'Total Band')
      :'<div class="vazio">Nenhuma linha neste filtro.</div>')+
    '</div>';
}
function viewRegras(){
  const passos = [
    ['Gatilho','cobertura de Skyy de no mínimo '+fmtPct(R.gatilho.minimo)+' na média de '+mesesDoGatilho+'. '+
      NOMES_MES[R.meses[0]].replace(/^./,(c)=>c.toUpperCase())+' não entra. Cada cliente conta uma vez no mês.'],
    ['Ranking','volume de Aperitivo. A pontuação é a soma dos % de '+listar(R.meses)+'.'],
    ['Trava','o % do mês vale no máximo '+fmtPct(R.trava[R.meses[0]])+' em '+mesesComTrava+'. '+
      listar(R.meses.filter((m)=>R.trava[m]===null)).replace(/^./,(c)=>c.toUpperCase())+' sem trava.'],
    ['Quem disputa','gerentes comerciais, supervisores Mista e Segmentada. O consultor acompanha, sem ranking. '+
      'O Ranking GC é por gerência comercial agrupada: algumas gerências da API somam numa linha só (o Detalhe do '+
      'mês e os filtros seguem com as gerências da API).'],
    ['Posição','todas as linhas numeradas; posição oficial só para quem bate o gatilho. Desempate pela ordem alfabética do código.'],
  ];
  const alertas = alertasDaTela(D);
  const classe = { erro:'erro', aviso:'aviso2', nota:'nota' };
  return '<section><h2>Como funciona</h2>'+
    passos.map((p,i)=>'<div class="item"><div class="ic">'+(i+1)+'</div><div><strong>'+esc(p[0])+':</strong> '+esc(p[1])+'</div></div>').join('')+
    '<div class="exemplo"><b>Trava:</b> um mês acima do limite entra pelo próprio limite, e o excedente não acumula na Soma. Ao lado do mês, em laranja, fica o % real.</div>'+
    '</section>'+
    '<section><h2>Status</h2>'+
    '<div class="st a"><span class="pill ok">✓ Bateu!</span><div>Bateu o gatilho de cobertura e está dentro das posições premiadas do seu ranking ('+esc(limites)+').</div></div>'+
    '<div class="st b"><span class="pill no">'+esc(TRACO)+'</span><div>Ainda não: gatilho pendente ou fora das posições premiadas.</div></div>'+
    '<p>Nas tabelas de ranking a coluna Status mostra só o selo. Nelas, o <strong>% do mês</strong> e o '+
    '<strong>% Acum.</strong> de Skyy aparecem num quadradinho <span class="pchip verde">verde</span> quando o % '+
    'chega ao mínimo do gatilho ('+pct(R.gatilho.minimo)+') e <span class="pchip vermelho">vermelho</span> quando '+
    'não chega; sem valor, não há quadradinho. A <strong>Dif.</strong> negativa aparece '+
    '<span style="color:var(--negv);font-weight:700">em vermelho</span>.</p>'+
    '<p>A coluna <strong style="color:var(--gold)">Oficial</strong> numera só quem bateu o gatilho; a posição em cinza é apenas a ordem na tela.</p>'+
    '<p>Os prêmios não aparecem no painel: o painel usa só a quantidade de posições premiadas para decidir o "Bateu!".</p>'+
    '</section>'+
    '<section><h2>Medidas</h2><table class="md"><tbody>'+
    '<tr><td>Real</td><td>Vendido até ontem (D-1)</td></tr>'+
    '<tr><td>Hoje</td><td>Online. Na cobertura, só clientes novos no mês</td></tr>'+
    '<tr><td>Meta dia</td><td>Volume: pronta na API; a tela mostra 0 quando o Real já passou da Meta. Cobertura: (Meta − Real) ÷ dias úteis restantes, em clientes inteiros para cima</td></tr>'+
    '<tr><td>Dif. e %</td><td>Real + Hoje − Meta · (Real + Hoje) ÷ Meta, truncado</td></tr>'+
    '<tr><td>Total Band</td><td>Todas as gerências (Diretoria e GP), sem ranking</td></tr>'+
    '</tbody></table>'+
    '<h2 style="margin-top:6px">Dados e alertas</h2><div class="al">'+
    (alertas.length?alertas.map((a)=>'<div class="'+classe[a.tipo]+'"><b>'+esc(a.titulo)+'</b>'+esc(a.texto)+'</div>').join('')
      :'<div class="nota">Nada a sinalizar.</div>')+
    '</div></section>';
}

function render(){
  $('abas').innerHTML = ABAS.map((a)=>'<button role="tab" data-aba="'+a.id+'" aria-selected="'+(a.id===st.aba)+'">'+esc(a.nome)+'</button>').join('');
  renderFiltros();
  ABAS.forEach((a)=>$('v-'+a.id).classList.toggle('on', a.id===st.aba));
  if(st.aba==='gc') $('v-gc').innerHTML = viewGC();
  else if(st.aba==='sv') $('v-sv').innerHTML = viewSV();
  else if(st.aba==='rt') $('v-rt').innerHTML = viewRT();
  else if(st.aba==='det') $('v-det').innerHTML = viewDet();
  else if(st.aba==='regras') $('rgbd').innerHTML = viewRegras();
}
$('abas').addEventListener('click', (e)=>{ const b=e.target.closest('button[data-aba]'); if(b){ st.aba=b.dataset.aba; render(); } });
$('filtros').addEventListener('click', (e)=>{ const b=e.target.closest('button[data-canal]'); if(b){ st.canal=b.dataset.canal; render(); } });
$('filtros').addEventListener('change', (e)=>{
  const t=e.target;
  if(t.id==='f-mes') st.mes = Number(t.value);
  else if(t.id==='f-mesdet') st.detMes = Number(t.value);
  else if(t.id==='f-ger') st.ger = t.value;
  else if(t.id==='f-sv') st.sv = t.value;
  else if(t.id==='f-vis') st.detVisao = t.value;
  render();
});
render();
})();
</script>
</body>
</html>
