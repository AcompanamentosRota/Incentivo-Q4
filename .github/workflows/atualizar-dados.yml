# Atualiza a API (api/v1/*.json) a partir do SAP Datasphere (OData) e republica o site quando algo mudou.
#
# Secrets  (Settings > Secrets and variables > Actions > Secrets):
#   DATASPHERE_CLIENT_ID, DATASPHERE_CLIENT_SECRET
# Variables (mesma tela, aba Variables):
#   DATASPHERE_TENANT_URL, DATASPHERE_TOKEN_URL, DATASPHERE_SPACE, DATASPHERE_ASSET
name: Atualizar dados (Datasphere)

on:
  schedule:
    # a cada 15 min, seg-sáb, 07:00-18:45 de Brasília (10:00-21:45 UTC).
    # O GitHub pode atrasar execuções agendadas alguns minutos.
    - cron: "*/15 10-21 * * 1-6"
  workflow_dispatch:
    inputs:
      modo:
        description: "real = Datasphere; simulado = dados fictícios (para o front antes das credenciais)"
        type: choice
        options: [real, simulado]
        default: real
      completa:
        description: "Carga completa (ignora a base do dia). Desmarcado: só o Online, se a base do dia valer"
        type: boolean
        default: false
  # ajustes do painel publicados (merge do PR): agrupadores extras entram na API sem esperar o agendamento
  push:
    branches: [main]
    paths: ["frontend/ajustes.json"]

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mudou: ${{ steps.gerar.outputs.mudou }}
    env:
      DATASPHERE_TENANT_URL: ${{ vars.DATASPHERE_TENANT_URL }}
      DATASPHERE_TOKEN_URL: ${{ vars.DATASPHERE_TOKEN_URL }}
      DATASPHERE_SPACE: ${{ vars.DATASPHERE_SPACE }}
      DATASPHERE_ASSET: ${{ vars.DATASPHERE_ASSET }}
      DATASPHERE_CLIENT_ID: ${{ secrets.DATASPHERE_CLIENT_ID }}
      DATASPHERE_CLIENT_SECRET: ${{ secrets.DATASPHERE_CLIENT_SECRET }}
      SAIDA_DIR: ../api
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # Base do dia (backend/gerador/base_dia.py): a 1ª rodada do dia faz a carga completa e guarda tudo menos o Online
      # no cache do Actions (nunca no repositório); as seguintes consultam só o Online. Uma chave por rodada que gravou
      # base (o cache não se sobrescreve); a restauração pega a mais recente do dia pelo prefixo.
      - name: Dia de hoje (Brasília)
        id: dia
        run: echo "dia=$(TZ=America/Sao_Paulo date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurar a base do dia
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.completa)
        uses: actions/cache/restore@v4
        with:
          path: backend/saida/base_dia
          key: base-dia-${{ steps.dia.outputs.dia }}-${{ github.run_id }}
          restore-keys: base-dia-${{ steps.dia.outputs.dia }}-

      - name: Gerar a API
        id: gerar
        working-directory: backend
        env:
          EVENTO: ${{ github.event_name }}
          MODO: ${{ inputs.modo }}
          COMPLETA: ${{ inputs.completa }}
        run: |
          ARGS=()
          # agendada e manual (o robô dispara a cada 15 min): incremental pela base do dia. Carga completa, que grava a
          # base: push do ajustes.json e manual com "completa" marcado
          if [ "$EVENTO" = "workflow_dispatch" ] || [ "$EVENTO" = "push" ]; then ARGS+=(--forcar); fi
          if [ "$EVENTO" = "push" ] || [ "$COMPLETA" = "true" ]; then ARGS+=(--completa); fi
          if [ "$MODO" = "simulado" ]; then ARGS+=(--simulado); else ARGS+=(--base-dia saida/base_dia/base.json); fi
          python scripts/gerar.py "${ARGS[@]}"

      - name: Guardar a base do dia
        if: steps.gerar.outputs.base_nova == 'true'
        uses: actions/cache/save@v4
        with:
          path: backend/saida/base_dia
          key: base-dia-${{ steps.dia.outputs.dia }}-${{ github.run_id }}

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-gerar
          path: backend/saida/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit dos dados
        if: steps.gerar.outputs.mudou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api/
          git diff --cached --quiet && exit 0
          git commit -m "dados: atualização $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  publicar:
    needs: gerar
    if: needs.gerar.outputs.mudou == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
